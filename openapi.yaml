      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/BatchId'

    get:
      operationId: getBatchOutput
      tags: [batch]
      summary: Download batch output as JSONL
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      responses:
        '200':
          description: NDJSON lines, one per item.
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/{workflowId}/batch/{batchId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/BatchId'

    post:
      operationId: cancelBatch
      tags: [batch]
      summary: Cancel a batch
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/{workflowId}/async:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'

    post:
      operationId: submitAsyncRun
      tags: [async]
      summary: Submit an async workflow run
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncSubmitRequest'
            examples:
              default:
                value:
                  input: {'q': 'hello'}
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      operationId: listAsyncRuns
      tags: [async]
      summary: List async runs for a workflow
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncRunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/{workflowId}/async/{operationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/OperationId'

    get:
      operationId: getAsyncRun
      tags: [async]
      summary: Get an async run
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: cancelAsyncRun
      tags: [async]
      summary: Cancel an async run
      servers:
        - url: https://gateway.graphn.ai
          description: Gateway
          x-graphn-name: gateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /{bucket}/{key}:
    parameters:
      - $ref: '#/components/parameters/Bucket'
      - $ref: '#/components/parameters/ObjectKey'

    head:
      operationId: headObject
      tags: [objects]
      summary: Probe object size and range support
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      responses:
        '200':
          description: Object exists.
          headers:
            Accept-Ranges:
              schema: {type: string}
            Content-Length:
              schema: {type: integer, format: int64}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      operationId: getObject
      tags: [objects]
      summary: Download an object
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Object bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Partial content.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: putObject
      tags: [objects]
      summary: Upload an object (single-shot)
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploadId
          in: query
          schema: {type: string}
        - name: partNumber
          in: query
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Uploaded. MPU part responses include an ETag header that must be echoed at complete.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Delete an object or abort an MPU
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploadId
          in: query
          schema: {type: string}
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: postObject
      tags: [objects]
      summary: MPU init/complete or mint a presigned URL
      description: |
        Query-string dispatch:
        
        - `?uploads` — initiate multipart upload.
        - `?uploadId=` — complete MPU. Body `{ "parts":[{"part_number":N,"etag":"..."}] }`.
        - `?type=download&expires=SEC` — presigned GET.
        - `?type=upload&expires=&max-size=&content-type=` — presigned PUT.
        - `?type=upload_part&upload_id=&part_number=` — presigned MPU part.
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploads
          in: query
          schema: {type: string}
        - name: uploadId
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string, enum: [download, upload, upload_part]}
        - name: expires
          in: query
          schema: {type: integer}
        - name: max-size
          in: query
          schema: {type: integer}
        - name: content-type
          in: query
          schema: {type: string}
        - name: upload_id
          in: query
          schema: {type: string}
        - name: part_number
          in: query
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MpuCompleteRequest'
            examples:
              default:
                value:
                  parts: [{'part_number': 1, 'etag': 'abc'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePostResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: graphn-api-key
      description: |
        Workspace-scoped API key issued in the Graphn dashboard. Format:
        `Authorization: Bearer gn_...`.
    GoogleOIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token issued for the Pub/Sub push subscription.
    InternalJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GraphN service-to-service JWT. Not accepted from end users.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace identifier the request is scoped to.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        minLength: 1
      example: ws_01HABCXYZ
    WorkspaceIdHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: |
        Workspace identifier. Optional when the API key itself is
        workspace-scoped (the standard case); required only when calling
        with an unscoped or system credential.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
    ModelId:
      name: modelId
      in: path
      required: true
      description: Custom model identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
      example: cm_01HABCXYZ
    SecretId:
      name: secretId
      in: path
      required: true
      description: Secret identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
      example: sec_01HABCXYZ
    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: Connection identifier.
      schema:
        type: string
        pattern: '^conn_[a-zA-Z0-9_-]+$'
      example: conn_01HABCXYZ
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ContinueToken:
      name: continue_token
      in: query
      required: false
      description: |
        Opaque pagination cursor returned by a previous list response.
        Pass back unchanged to fetch the next page.
      schema:
        type: string

    AgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    FunctionId:
      name: functionId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    ServerId:
      name: serverId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    TriggerId:
      name: triggerId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    ImportedModelId:
      name: importedModelId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    KbId:
      name: kbId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    DocId:
      name: docId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    OrgId:
      name: orgId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    KeyId:
      name: keyId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    StoreName:
      name: storeName
      in: path
      required: true
      schema: {type: string, minLength: 1}
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Bucket:
      name: bucket
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ObjectKey:
      name: key
      in: path
      required: true
      description: Object key. Slash-separated segments should be percent-encoded.
      schema: {type: string, minLength: 1}

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: missing or invalid API key
    Forbidden:
      description: API key is valid but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: API key is not valid for this workspace
    NotFound:
      description: Resource does not exist or is not visible to this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: custom model not found
    Conflict:
      description: Resource conflict (duplicate name, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NAME_CONFLICT
            message: a custom model with this name already exists
    ValidationError:
      description: Request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 'huggingface_model_id is required for all weight_source values (canonical model identifier)'
    InferenceBadRequest:
      description: Inference request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    InferenceNotFound:
      description: Model could not be resolved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    InferenceUnavailable:
      description: |
        Custom model is not in the `ready` state (still deploying,
        scaled to zero, or failed). Call `wakeCustomModel` if scaled
        to zero, or `getCustomModel` to inspect the current `status`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    BadGateway:
      description: Upstream service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AF_ERROR
            message: upstream execution engine unavailable
    ServiceUnavailable:
      description: Required provider or service configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_NOT_CONFIGURED
            message: connection provider is not configured

  schemas:
    BillingAccount:
      type: object
      required: [orgId, stripeCustomerId, billingEmail, rechargeAmountCents, autoRechargeEnabled, hasPurchased]
      properties:
        orgId: {type: string}
        stripeCustomerId: {type: string}
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64}
        hasPurchased: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
    BillingSettingsUpdate:
      type: object
      properties:
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64, minimum: 0}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64, minimum: 1}
    BillingTopUpRequest:
      type: object
      required: [amountCents, idempotencyKey]
      properties:
        amountCents: {type: integer, format: int64, minimum: 1}
        idempotencyKey: {type: string, minLength: 1}
    BillingGrantResult:
      type: object
      required: [alreadyDone, omGrantId, newBalanceCents, newStatus]
      properties:
        alreadyDone: {type: boolean}
        paymentIntentId: {type: string}
        omGrantId: {type: string}
        newBalanceCents: {type: integer, format: int64}
        newStatus: {type: string, enum: [ok, low, out_of_balance]}
    PaymentMethod:
      type: object
      required: [id, brand, last4, expMonth, expYear, isDefault]
      properties:
        id: {type: string}
        brand: {type: string}
        last4: {type: string}
        expMonth: {type: integer}
        expYear: {type: integer}
        isDefault: {type: boolean}
    Invoice:
      type: object
      required: [id, invoiceId, status, amountDue, currency, created, periodStart, periodEnd]
      properties:
        id: {type: string}
        invoiceId: {type: string}
        number: {type: string}
        status:
          type: string
          enum: [closed, current, reserved, open, mismatch, voiding, void, paid, failed, stale]
        amountDue: {type: integer, format: int64}
        currency: {type: string}
        created: {type: integer, format: int64}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        hostedInvoiceUrl: {type: string}
        invoicePdf: {type: string, minLength: 1}
        usageByWeek:
          type: array
          items: {$ref: '#/components/schemas/UsageWeek'}
    BillingStatementSummary:
      type: object
      required: [periodStart, periodEnd, status]
      properties:
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        status: {type: string}
        openingCents: {type: integer, format: int64}
        usageCents: {type: integer, format: int64}
        creditedCents: {type: integer, format: int64}
        debitedCents: {type: integer, format: int64}
        closingCents: {type: integer, format: int64}
        amountDueCents: {type: integer, format: int64}
        revision: {type: integer}
        inputFingerprint: {type: string}
    BillingStatementDetail:
      type: object
      required:
        [orgId, periodStart, periodEnd, status, openingCents, usageCents, creditedCents, debitedCents, creditsCents, closingCents, amountDueCents, revision, generatedAt]
      properties:
        orgId: {type: string}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        status: {type: string}
        openingCents: {type: integer, format: int64}
        usageCents: {type: integer, format: int64}
        creditedCents: {type: integer, format: int64}
        debitedCents: {type: integer, format: int64}
        creditsCents: {type: integer, format: int64}
        closingCents: {type: integer, format: int64}
        amountDueCents: {type: integer, format: int64}
        revision: {type: integer}
        inputFingerprint: {type: string}
        usageByDay:
          type: array
          items: {$ref: '#/components/schemas/UsageDay'}
        generatedAt: {type: string, format: date-time}
        statementPdf: {type: string}
        statementPreviewUrl: {type: string}
    UsageDay:
      type: object
      required: [date, amountCents]
      properties:
        date: {type: string, format: date}
        amountCents: {type: integer, format: int64}
    UsageWeek:
      type: object
      required: [periodStart, periodEnd, amountCents]
      properties:
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        amountCents: {type: integer, format: int64}
    FreeGrantResult:
      type: object
      required: [balanceCents, balanceStatus, alreadyClaimed]
      properties:
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        alreadyClaimed: {type: boolean}
    BillingEntitlements:
      type: object
      required: [balanceCents, balanceStatus, hasPurchased]
      properties:
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        hasPurchased: {type: boolean}
        allowNegativeBalance:
          type: boolean
          description: >-
            True when the org is permitted to run below zero (invoice terms). A
            negative balanceCents is expected usage for these orgs, not a debt
            blocking them.
        negativeLimitCents:
          type: integer
          format: int64
          description: >-
            Positive magnitude of how far below zero the org may run; the org is
            blocked at -negativeLimitCents. Omitted when the allowance is
            uncapped, and meaningless when allowNegativeBalance is false.
        freeGrantStatus: {type: string}
    BillingUsage:
      type: object
      required: [totalSpendCents, currentPeriodStart, currentPeriodEnd, nextBillingDate, timeSeries]
      properties:
        totalSpendCents: {type: integer, format: int64}
        currentPeriodStart: {type: string, format: date-time}
        currentPeriodEnd: {type: string, format: date-time}
        nextBillingDate: {type: string}
        timeSeries:
          type: array
          items:
            type: object
            required: [timestamp, amountCents]
            properties:
              timestamp: {type: string, format: date-time}
              amountCents: {type: integer, format: int64}
    AdminBillingState:
      type: object
      required: [orgId, billingAccountExists, balanceCents, balanceStatus]
      properties:
        orgId: {type: string}
        billingAccountExists: {type: boolean}
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        stripeCustomerId: {type: string}
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64}
        hasPurchased: {type: boolean}
        customModelsDisabled: {type: boolean}
        allowNegativeBalance: {type: boolean}
        negativeLimitCents: {type: integer, format: int64}
        reserveEstCents: {type: integer, format: int64, nullable: true}
        reserveEstCentsDefault: {type: integer, format: int64}
    AdminBillingOverrides:
      type: object
      required: [comment]
      properties:
        customModelsDisabled: {type: boolean}
        allowNegativeBalance: {type: boolean}
        negativeLimitCents: {type: integer, format: int64}
        reserveEstCents: {type: integer, format: int64, nullable: true}
        hasPurchased: {type: boolean}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminBillingGrantRequest:
      type: object
      required: [amountCents, comment]
      properties:
        amountCents: {type: integer, format: int64}
        comment: {type: string, minLength: 1, maxLength: 2000}
        idempotencyKey: {type: string}
    AdminInvoicesResponse:
      type: object
      required: [invoices]
      properties:
        invoices:
          type: array
          items: {$ref: '#/components/schemas/Invoice'}
        emptyReason:
          type: string
          enum: [no_billing_history, statements_not_generated_yet]
    AdminInvoiceResponse:
      type: object
      required: [invoice]
      properties:
        invoice: {$ref: '#/components/schemas/Invoice'}
    AdminInvoicePreviewRequest:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        renderingMode: {type: string}
      description: Preview always requires explicit [from, to) bounds.
    AdminInvoiceCreateRequest:
      type: object
      required: [from, to, manifestSha256, comment]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        manifestSha256: {type: string, minLength: 1}
        renderingMode: {type: string}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminInvoiceRecordPaymentRequest:
      type: object
      required: [checksum, comment]
      properties:
        checksum: {type: string, minLength: 1}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminInvoiceVoidRequest:
      type: object
      required: [from, to, comment]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminInvoiceDiscountRequest:
      type: object
      additionalProperties: false
      required: [from, to, expectedRevision, type, value, reason, comment]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        expectedRevision: {type: integer, minimum: 0}
        idempotencyKey: {type: string}
        type:
          type: string
          enum: [fixed_amount_cents, percentage]
        value:
          type: integer
          format: int64
          description: |
            Discount input value. For percentage discounts this is basis points
            (1..9999 = 0.01%..99.99%). For fixed_amount_cents this is cents.
        reason: {type: string, minLength: 1}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminInvoiceStatementRef:
      type: object
      required: [periodStart, periodEnd, revision, inputFingerprint]
      properties:
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        revision: {type: integer}
        inputFingerprint: {type: string}
    AdminInvoiceReplaceStatementRefsRequest:
      type: object
      additionalProperties: false
      required: [from, to, expectedCurrent, desired, comment]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        expectedCurrent:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceStatementRef'}
        desired:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceStatementRef'}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminInvoiceReplaceStatementRefsResponse:
      type: object
      required: [current, updated, disposition]
      properties:
        current:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceStatementRef'}
        updated:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceStatementRef'}
        disposition:
          type: string
          enum: [updated, unchanged]
    AdminInvoiceQuoteLineItem:
      type: object
      required: [description, amountCents]
      properties:
        description: {type: string}
        amountCents: {type: integer, format: int64}
    AdminInvoiceQuote:
      type: object
      required: [orgId, customerId, period, amountCents, lineItems]
      properties:
        orgId: {type: string}
        customerId: {type: string}
        period: {type: string}
        amountCents: {type: integer, format: int64}
        lineItems:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceQuoteLineItem'}
    AdminInvoicePreviewResponse:
      type: object
      required: [periodStart, periodEnd, manifestSha256, quote]
      properties:
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        manifestSha256: {type: string}
        renderingMode: {type: string}
        quote: {$ref: '#/components/schemas/AdminInvoiceQuote'}
    AdminInvoiceCreateResponse:
      allOf:
        - $ref: '#/components/schemas/AdminInvoicePreviewResponse'
        - type: object
          required: [invoiceId, invoiceStatus, amountDueCents]
          properties:
            invoiceId: {type: string}
            invoiceStatus: {type: string}
            amountDueCents: {type: integer, format: int64}
            hostedInvoiceUrl: {type: string}
    AdminInvoicePaymentPreviewResponse:
      type: object
      required:
        [orgId, invoiceId, stripeCustomerId, currency, invoiceTotalCents, invoiceAmountPaidCents, overlayPeriodStart, overlayPeriodEnd, overlayExpectedAmountCents, idempotencyKey, alreadyRecorded, recordedSequence, checksum]
      properties:
        orgId: {type: string}
        invoiceId: {type: string}
        stripeCustomerId: {type: string}
        currency: {type: string}
        invoiceTotalCents: {type: integer, format: int64}
        invoiceAmountPaidCents: {type: integer, format: int64}
        overlayPeriodStart: {type: string, format: date-time}
        overlayPeriodEnd: {type: string, format: date-time}
        overlayExpectedAmountCents: {type: integer, format: int64}
        idempotencyKey: {type: string}
        alreadyRecorded: {type: boolean}
        recordedSequence: {type: integer, format: int64}
        checksum: {type: string}
    AdminInvoiceRecordPaymentResponse:
      type: object
      required:
        [orgId, invoiceId, idempotencyKey, alreadyRecorded, journalSequence, projectionStatus, balanceProjectionPending]
      properties:
        orgId: {type: string}
        invoiceId: {type: string}
        idempotencyKey: {type: string}
        alreadyRecorded: {type: boolean}
        journalSequence: {type: integer, format: int64}
        projectionStatus: {type: string}
        balanceProjectionPending: {type: boolean}
    AdminInvoiceVoidResponse:
      type: object
      required: [orgId, periodStart, periodEnd, invoiceId, invoiceStatus, amountDueCents]
      properties:
        orgId: {type: string}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        invoiceId: {type: string}
        invoiceStatus: {type: string}
        amountDueCents: {type: integer, format: int64}
        hostedInvoiceUrl: {type: string}
    AdminInvoiceDiscount:
      type: object
      required: [type, inputValue, discountCents, reason, actor, idempotencyKey, status, originalAmountCents, adjustedAmountCents]
      properties:
        type: {type: string}
        inputValue: {type: integer, format: int64}
        discountCents: {type: integer, format: int64}
        reason: {type: string}
        actor: {type: string}
        idempotencyKey: {type: string}
        providerSourceId: {type: string}
        providerResultId: {type: string}
        status: {type: string}
        appliedAt: {type: string, format: date-time}
        originalAmountCents: {type: integer, format: int64}
        adjustedAmountCents: {type: integer, format: int64}
    AdminInvoiceDiscountResponse:
      type: object
      required: [orgId, periodStart, periodEnd, invoiceId, invoiceStatus, revision, rootInvoiceId, originalAmountCents, adjustedAmountCents, discount]
      properties:
        orgId: {type: string}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        invoiceId: {type: string}
        invoiceStatus: {type: string}
        revision: {type: integer}
        rootInvoiceId: {type: string}
        supersedesInvoiceId: {type: string}
        originalAmountCents: {type: integer, format: int64}
        adjustedAmountCents: {type: integer, format: int64}
        hostedInvoiceUrl: {type: string}
        discount: {$ref: '#/components/schemas/AdminInvoiceDiscount'}
    AdminInvoiceRevision:
      type: object
      required: [revision, invoiceId, status, rootInvoiceId, originalAmountCents, adjustedAmountCents, createdAt]
      properties:
        revision: {type: integer}
        invoiceId: {type: string}
        status: {type: string}
        rootInvoiceId: {type: string}
        supersedesInvoiceId: {type: string}
        originalAmountCents: {type: integer, format: int64}
        adjustedAmountCents: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        statusUpdatedAt: {type: string, format: date-time}
        discount: {$ref: '#/components/schemas/AdminInvoiceDiscount'}
    AdminInvoiceRevisionsResponse:
      type: object
      required: [orgId, periodStart, periodEnd, revisions]
      properties:
        orgId: {type: string}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        revisions:
          type: array
          items: {$ref: '#/components/schemas/AdminInvoiceRevision'}

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error description.

    InferenceError:
      type: object
      description: |
        OpenAI-style error envelope returned by the inference host. The
        shape mirrors the OpenAI API for compatibility with existing
        OpenAI client libraries.
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: string, nullable: true }
            code: { type: string, nullable: true }

    WeightSource:
      type: string
      enum: [huggingface, s3_presigned, s3_assume_role]
      description: |
        Source of the model weights:
        - `huggingface`: download from HuggingFace using `huggingface_model_id`
        - `s3_presigned`: download from a presigned S3 URL
        - `s3_assume_role`: download from S3 using an assumed IAM role

    Capability:
      type: string
      enum: [tool_calling, vision, embedding, reasoning]
      description: A model capability tag used for filtering and routing.

    CustomModelStatus:
      type: string
      enum: [pending, deploying, ready, failed, deleting]
      description: |
        Lifecycle state:
        - `pending`: record created, deployment not yet started
        - `deploying`: weights downloading, replicas booting
        - `ready`: at least one replica is serving (or scaled to zero with cooldown)
        - `failed`: deployment failed; see `error_message`
        - `deleting`: teardown in progress

    InferenceRouterCandidate:
      type: object
      required: [target, lanes, weight, order]
      additionalProperties: false
      properties:
        target:
          type: string
          description: Unprefixed built-in alias or `custom:cm_...` logical reference.
          pattern: '^(?:[a-z0-9][a-z0-9._-]{0,127}|custom:cm_[0-9a-f]{12})$'
        lanes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^(?:general|code|quantitative|image|video|audio|contract|long_context|custom:lane_[0-9a-f]{12})$'
        weight:
          type: integer
          minimum: 1
          maximum: 100
        order:
          type: integer
          minimum: 0

    InferenceRouterConfig:
      type: object
      required: [preset, candidates]
      additionalProperties: false
      properties:
        preset:
          type: string
          enum: [balanced]
        candidates:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/InferenceRouterCandidate'
        fallback_policy:
          type: string
          enum: [fail_closed, degraded_general]
          default: fail_closed
          description: >-
            What callers get when no shard can classify the request.
            `degraded_general` serves the highest-weight general candidate
            without classification, trading routing quality for availability.

    PublishedRouterCandidate:
      type: object
      required:
        - reference
        - target
        - lanes
        - weight
        - order
        - capabilities
        - context_window
        - context_length
        - quality_score
        - prompt_per_1m
        - completion_per_1m
      properties:
        reference:
          type: string
        target:
          type: string
        lanes:
          type: array
          items:
            type: string
            pattern: '^(?:general|code|quantitative|image|video|audio|contract|long_context|custom:lane_[0-9a-f]{12})$'
        weight:
          type: integer
        order:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        context_window:
          type: integer
          minimum: 1
        context_length:
          type: integer
          minimum: 1
        quality_score:
          type: number
          minimum: 0
          maximum: 1
        prompt_per_1m:
          type: number
          minimum: 0
        completion_per_1m:
          type: number
          minimum: 0

    PublishedRouterDecision:
      type: object
      required: [name, lane, candidate_refs, priority]
      properties:
        name:
          type: string
        lane:
          type: string
          pattern: '^(?:code|quantitative|image|video|audio|contract|long_context|custom:lane_[0-9a-f]{12})$'
        constraints:
          type: array
          items:
            type: string
            pattern: '^(?:code|quantitative|image|video|audio|contract|long_context|custom:lane_[0-9a-f]{12})$'
        candidate_refs:
          type: array
          items:
            type: string
        priority:
          type: integer

    PublishedRouterRevision:
      type: object
      required:
        - router_id
        - revision
        - state
        - candidates
        - decisions
        - general_candidate_refs
        - manifest_hash
      properties:
        router_id:
          type: string
        revision:
          type: string
        state:
          type: string
          enum: [active, staged]
        preferred_shard_id:
          type: string
          description: Operator-owned placement hint; populated only for Platform Auto.
        candidates:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/PublishedRouterCandidate'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/PublishedRouterDecision'
        general_candidate_refs:
          type: array
          items:
            type: string
        manifest_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        custom_lanes:
          type: array
          description: Snapshot of every workspace custom lane the revision uses.
          items:
            $ref: '#/components/schemas/PublishedRouterCustomLane'

    PublishedRouterCustomLane:
      type: object
      required: [reference, match, phrases]
      properties:
        reference:
          type: string
          pattern: '^custom:lane_[0-9a-f]{12}$'
        match:
          type: string
          enum: [any, all]
        phrases:
          type: array
          items:
            type: string

    InferenceRouterLaneCreate:
      type: object
      required: [display_name, phrases]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 280
        match:
          type: string
          enum: [any, all]
          default: any
          description: '`any` matches when one phrase appears; `all` requires every phrase.'
        phrases:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64

    InferenceRouterLaneUpdate:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 280
        match:
          type: string
          enum: [any, all]
        phrases:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64

    InferenceRouterLane:
      type: object
      required: [id, reference, display_name, match, phrases, version, used_by, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^lane_[0-9a-f]{12}$'
        reference:
          type: string
          description: The value to put in a router candidate's `lanes`.
          pattern: '^custom:lane_[0-9a-f]{12}$'
        display_name:
          type: string
        description:
          type: string
        match:
          type: string
          enum: [any, all]
        phrases:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        used_by:
          type: array
          description: >-
            IDs of routers whose draft, pending, active, or draining revision
            references this lane. A previous revision keeps draining from its
            shard for a while after a newer one activates, so a router can stay
            listed (and DELETE can stay 409) after its current revisions have
            dropped the lane.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InferenceRouterLaneList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InferenceRouterLane'
        total:
          type: integer

    InferenceRouterRevision:
      type: object
      required: [number, status, config, manifest_hash, created_at, updated_at]
      properties:
        number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, pending, active, failed]
        config:
          $ref: '#/components/schemas/InferenceRouterConfig'
        manifest_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        shard_placements:
          type: array
          description: >-
            Shards carrying this revision. A revision has one `primary`
            placement; a second `migrating` placement exists only while the
            revision is being moved to another shard.
          items:
            type: object
            required: [shard_id, alias, role, state]
            properties:
              shard_id:
                type: string
              alias:
                type: string
              role:
                type: string
                enum: [primary, migrating]
              state:
                type: string
                enum: [assigned, active, draining]
        custom_lanes:
          type: array
          description: >-
            The custom lane definitions this revision was saved with. Compare
            against the current lanes to tell when a router needs republishing.
          items:
            $ref: '#/components/schemas/PublishedRouterCustomLane'
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InferenceRouter:
      type: object
      required: [id, name, display_name, scope, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: "`ir_...` for workspace routers; `auto` for the immutable platform adapter."
        workspace_id:
          type: string
        owner_id:
          type: string
        name:
          type: string
        display_name:
          type: string
        scope:
          type: string
          enum: [workspace, platform]
        status:
          type: string
          enum: [draft, pending, active, failed, deleting, deleted]
        draft_revision:
          allOf:
            - $ref: '#/components/schemas/InferenceRouterRevision'
          nullable: true
        pending_revision:
          allOf:
            - $ref: '#/components/schemas/InferenceRouterRevision'
          nullable: true
        active_revision:
          allOf:
            - $ref: '#/components/schemas/InferenceRouterRevision'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InferenceRouterCreate:
      type: object
      additionalProperties: false
      required: [name, preset, candidates]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          maxLength: 100
        display_name:
          type: string
        preset:
          type: string
          enum: [balanced]
        candidates:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/InferenceRouterCandidate'
        fallback_policy:
          type: string
          enum: [fail_closed, degraded_general]
          default: fail_closed

    InferenceRouterUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        display_name:
          type: string
        preset:
          type: string
          enum: [balanced]
        candidates:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/InferenceRouterCandidate'
        fallback_policy:
          type: string
          enum: [fail_closed, degraded_general]

    InferenceRouterValidation:
      type: object
      required: [valid, manifest, manifest_hash]
      properties:
        valid:
          type: boolean
        manifest:
          type: string
        manifest_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'

    InferenceRouterList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InferenceRouter'
        total:
          type: integer
        continue_token:
          type: string

    InferenceRouterAnalyticsMetrics:
      type: object
      required:
        [requests, input_tokens, output_tokens, total_tokens, success_count,
         error_count, duration_ms_sum, average_latency_ms, estimated_cost,
         shared_candidate_gpu_seconds]
      properties:
        requests: { type: integer, format: int64 }
        input_tokens: { type: number, format: double }
        output_tokens: { type: number, format: double }
        total_tokens: { type: number, format: double }
        success_count: { type: integer, format: int64 }
        error_count: { type: integer, format: int64 }
        duration_ms_sum: { type: number, format: double }
        average_latency_ms: { type: number, format: double }
        approximate_p50_latency_ms: { type: number, format: double, nullable: true }
        approximate_p95_latency_ms: { type: number, format: double, nullable: true }
        estimated_cost:
          type: number
          format: double
          nullable: true
          description: Sum of event-provided estimated_cost_usd; no local rates are applied.
        shared_candidate_gpu_seconds:
          type: number
          nullable: true
          format: double
          description: Shared runtime for historically selected custom models, not router-attributed cost.

    InferenceRouterAnalyticsPoint:
      type: object
      required: [timestamp, metrics]
      properties:
        timestamp: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/InferenceRouterAnalyticsMetrics' }

    InferenceRouterAnalyticsBreakdown:
      type: object
      required: [key, metrics]
      properties:
        key: { type: string }
        model_ref: { type: string }
        model_source: { type: string }
        metrics: { $ref: '#/components/schemas/InferenceRouterAnalyticsMetrics' }

    InferenceRouterAnalytics:
      type: object
      required:
        [router_id, interval, summary, time_series, model_breakdown,
         decision_breakdown, status_breakdown, shard_breakdown,
         shared_candidate_runtime_status,
         shared_candidate_runtime_refs_total, shared_candidate_runtime_refs_included,
         coverage_from, coverage_through, complete]
      properties:
        router_id: { type: string }
        interval: { type: string, enum: [hour, day] }
        summary: { $ref: '#/components/schemas/InferenceRouterAnalyticsMetrics' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/InferenceRouterAnalyticsPoint' }
        model_breakdown:
          type: array
          items: { $ref: '#/components/schemas/InferenceRouterAnalyticsBreakdown' }
        decision_breakdown:
          type: array
          items: { $ref: '#/components/schemas/InferenceRouterAnalyticsBreakdown' }
        status_breakdown:
          type: array
          items: { $ref: '#/components/schemas/InferenceRouterAnalyticsBreakdown' }
        shard_breakdown:
          type: array
          description: >-
            Requests attributed to the shard that served them, which differs
            from the router's primary placement after a failover or during a
            shard migration.
          items: { $ref: '#/components/schemas/InferenceRouterAnalyticsBreakdown' }
        shared_candidate_runtime_status:
          type: string
          enum: [complete, degraded, not_applicable]
        shared_candidate_runtime_refs_total: { type: integer }
        shared_candidate_runtime_refs_included: { type: integer }
        coverage_from:
          type: string
          format: date-time
          nullable: true
          description: Earliest complete analytics bucket available.
        coverage_through:
          type: string
          format: date-time
          nullable: true
          description: Exclusive end of complete analytics buckets proven by the ingestion frontier.
        complete:
          type: boolean
          description: True only when the requested range is fully inside analytics coverage.

    CustomModel:
      type: object
      additionalProperties: true
      description: |
        Public custom model record. Additional internal fields may be
        present in responses but are not documented and may change
        without notice. Generated SDKs ignore them.
      required:
        - id
        - name
        - workspace_id
        - status
        - weight_source
        - gpu_count
        - capabilities
        - min_replicas
        - max_replicas
        - cooldown_seconds
        - gpu_memory_utilization
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Stable model identifier (`cm_...`).
        name:
          type: string
          description: |
            URL-safe model name. Pass this as the `model` field on
            `createChatCompletion` once `status` is `ready`.
          pattern: '^[a-zA-Z0-9_\-/:.]+$'
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          description: Human-friendly name for UI display.
        workspace_id: { type: string }
        status: { $ref: '#/components/schemas/CustomModelStatus' }
        weight_source: { $ref: '#/components/schemas/WeightSource' }
        huggingface_model_id:
          type: string
          description: Set when `weight_source` is `huggingface`.
        s3_url:
          type: string
          nullable: true
          description: Set when `weight_source` is `s3_presigned` or `s3_assume_role`.
        s3_role_arn:
          type: string
          nullable: true
          description: Set when `weight_source` is `s3_assume_role`.
        artifact_type:
          type: string
          nullable: true
          enum: [base, lora]
          description: |
            Whether this import is a full base checkpoint or a LoRA
            adapter on top of an allowlisted base. Set eagerly at
            create-time:

            * **`huggingface`** imports are classified by probing
              `adapter_config.json` on the upstream repo.
            * **`s3_*`** imports are classified as `lora` iff
              `base_model_id` is supplied on the create request;
              otherwise the bundle is treated as `base`. If the
              downloaded S3 bundle later turns out to be a LoRA
              adapter (caller forgot the hint), the model deploys to
              `failed` with an actionable `error_message`.
        base_model_id:
          type: string
          nullable: true
          description: |
            Populated when `artifact_type=lora`. The base model id the
            adapter loads on top of. For HuggingFace imports this is
            either `adapter_config.json::base_model_name_or_path` or
            the caller's `base_model_id` override on
            `CustomModelCreate` (the override wins on disagreement).
            For S3 imports it is the caller-supplied
            `base_model_id` from `CustomModelCreate`.
        lora_adapter_name:
          type: string
          nullable: true
          description: |
            Name the LoRA adapter is served under.
            Defaults to the model's short name. It is internal to the
            deployment: clients call the model as `custom:<id>`.
        lora_rank:
          type: integer
          nullable: true
          description: |
            `r` value from `adapter_config.json` when `artifact_type=lora`.
        gpu_count:
          type: integer
          minimum: 1
          description: Number of GPUs allocated per replica.
        max_model_len:
          type: integer
          nullable: true
          description: Maximum context length in tokens.
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          description: Fraction of GPU memory the inference runtime is allowed to use.
        quantization:
          type: string
          nullable: true
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
          description: Weight quantization scheme, if any.
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        min_replicas:
          type: integer
          minimum: 0
          maximum: 3
          description: Minimum replicas to keep warm. `0` allows scale-to-zero.
        max_replicas:
          type: integer
          minimum: 1
          maximum: 8
          description: Maximum replicas the autoscaler may run.
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Idle seconds before scaling down to `min_replicas`.
        replicas_available:
          type: integer
          nullable: true
          description: Currently serving replicas (live status).
        endpoint:
          type: string
          nullable: true
          description: Internal cluster endpoint serving this model. Informational only — clients should use `chat.completions` with the model's `name`.
        error_message:
          type: string
          nullable: true
          description: Populated when `status` is `failed`.
        num_params:
          type: integer
          nullable: true
          description: Parameter count detected from the model config.
        estimated_memory_gb:
          type: number
          nullable: true
          description: Estimated GPU memory required for serving.
        architectures:
          type: array
          nullable: true
          items: { type: string }
          description: HuggingFace `architectures` field from `config.json`.
        lora_enabled:
          type: boolean
          description: |
            Preview. Present and `true` on a shared LoRA base, which serves
            its own weights plus attached adapters.
        max_lora_rank:
          type: integer
          description: Preview. Highest adapter rank a shared LoRA base accepts.
        max_adapters:
          type: integer
          description: Preview. Most adapters a shared LoRA base can have attached.
        parent_model_id:
          type: string
          description: |
            Preview. Present on an adapter attached to a shared LoRA base:
            the base's `id`.
        adapter_digest:
          type: string
          description: |
            Preview. Present on an adapter once its files have been staged:
            the digest of the staged adapter.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomModelCreate:
      type: object
      additionalProperties: false
      required: [name, huggingface_model_id]
      properties:
        name:
          type: string
          description: |
            URL-safe model name; use this when calling `chat.completions`
            once the model is `ready`. Must be unique within the workspace.
          pattern: '^[a-zA-Z0-9_\-/:.]+$'
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          maxLength: 100
          description: Human-friendly name for UI display. Defaults to `name`.
        weight_source:
          $ref: '#/components/schemas/WeightSource'
          default: huggingface
        huggingface_model_id:
          type: string
          minLength: 3
          maxLength: 200
          description: |
            Canonical model identifier (`org/model-name`). **Required
            for every `weight_source`**: this is the name the inference
            endpoint advertises and the value clients pass in `model`
            for chat completions, so without it the deployed model has
            no stable name to address via inference. For `huggingface`
            it also drives the download; for the S3 sources it mirrors
            the "Model ID" field in the web UI's S3 import flow.
          example: meta-llama/Llama-3-8B-Instruct
        s3_url:
          type: string
          maxLength: 2048
          description: |
            Required when `weight_source` is `s3_presigned` or
            `s3_assume_role`. Conditional requirement is enforced by
            the server (returns 422); not encoded as a JSON Schema
            keyword for OAS-3.0-tooling compatibility.
        s3_role_arn:
          type: string
          pattern: '^arn:aws:iam::\d{12}:role/(?:[\w+=,.@-]+/)*graphn-byom-[\w+=,.@-]+$'
          description: |
            Required when `weight_source` is `s3_assume_role`. The role
            name (the segment after `:role/`) must start with
            `graphn-byom-`; GraphN's platform IAM policy is scoped to
            that prefix as a defense-in-depth boundary, and the
            customer-facing CloudFormation template enforces the same
            constraint at stack-create time. Conditional requirement
            (s3_assume_role only) is enforced by the server (returns
            422); the format itself is checked against this pattern.
        hf_token_secret_id:
          type: string
          description: |
            ID of a workspace secret holding a HuggingFace access token.
            Required for gated HuggingFace models.
        gpu_count:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
        max_model_len:
          type: integer
          minimum: 256
          maximum: 262144
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.9
        quantization:
          type: string
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
          default: [tool_calling]
        min_replicas:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        max_replicas:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
        base_model_id:
          type: string
          maxLength: 200
          description: |
            Override / hint for LoRA imports. Must be one of the
            platform's allowlisted base models (see
            `GET /v1/{workspaceId}/custom-models/supported-architectures`).

            * **`weight_source=s3_*`**: this is the **only** way to
              classify the bundle as a LoRA adapter at create-time --
              omitting it routes the import through the base path,
              and a bundle that later turns out to be a LoRA adapter
              will deploy to `failed` with an actionable error
              ("re-create with `base_model_id` set").
            * **`weight_source=huggingface`**: the field **overrides**
              `adapter_config.json::base_model_name_or_path` from the
              adapter repo. Useful for adapters trained against a
              local filesystem path (e.g. `C:/users/.../base`) whose
              recorded base id isn't a valid HF id. When the override
              disagrees with the adapter's declared base the caller's
              value wins; the disagreement is logged server-side for
              debuggability.

            Ignored when the resolved artifact type is `base`.
          example: Qwen/Qwen3.5-4B
        lora_enabled:
          type: boolean
          default: false
          description: |
            Preview, refused unless enabled for the workspace's
            deployment. Creates a shared LoRA base: one GPU deployment
            that serves its own weights and the adapters attached to it.
            Requires `max_lora_rank`. Cannot be combined with
            `base_model_id`, `quantization`, `disaggregated_pd`,
            `speculative_decoding`, `weight_source: s3_presigned` or more
            than one GPU. The base must be a dense Llama, Mistral, Qwen2,
            Qwen3, Qwen3.5, Qwen3.6, Qwen3.8 or Gemma 4 model (Gemma 4 31B
            and 26B-A4B excluded); any other base fails to deploy.
        max_lora_rank:
          type: integer
          enum: [16, 64]
          description: |
            Preview. Required with `lora_enabled`; no default. The highest
            adapter rank the base accepts. Fixed at creation: the runtime
            reserves GPU memory for it, so a lower rank leaves more KV cache.
            It also fixes the base's `max_adapters` (8 at either rank), which
            cannot be set on create.

    CustomModelAdapterAttach:
      type: object
      additionalProperties: false
      description: |
        Preview. Request body for
        `POST /v1/{workspaceId}/custom-models/{modelId}/adapters`.
      properties:
        name:
          type: string
          description: |
            URL-safe adapter name. Must be unique within the workspace.
            Defaults to the last segment of `huggingface_model_id`,
            lowercased. Chat completions take the adapter's ID
            (`custom:<id>`), not its name.
          pattern: '^[a-zA-Z0-9_\-/:.]+$'
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          maxLength: 100
          description: Human-friendly name for UI display. Defaults to `name`.
        weight_source:
          $ref: '#/components/schemas/WeightSource'
          default: huggingface
        huggingface_model_id:
          type: string
          maxLength: 193
          description: |
            Hugging Face repo id (`org/name`) of the adapter. Required when
            `weight_source` is `huggingface`; enforced by the server.
          example: my-org/qwen3-32b-support-lora
        hf_token_secret_id:
          type: string
          description: |
            ID of a workspace secret holding a HuggingFace access token.
            Required for gated or private adapter repos.
        s3_url:
          type: string
          maxLength: 2048
          description: |
            Required when `weight_source` is `s3_presigned` or
            `s3_assume_role`; enforced by the server.
        s3_role_arn:
          type: string
          pattern: '^arn:aws:iam::\d{12}:role/(?:[\w+=,.@-]+/)*graphn-byom-[\w+=,.@-]+$'
          description: |
            Required when `weight_source` is `s3_assume_role`. The role name
            must start with `graphn-byom-`.
        s3_external_id:
          type: string
          pattern: '^[A-Za-z0-9+/=_\-]{16,256}$'
          description: |
            ExternalId from the customer's IAM trust policy, for
            `s3_assume_role`. Generated when omitted.
        base_mismatch_acknowledged:
          type: boolean
          default: false
          description: |
            Accept an adapter whose declared base differs from this base's
            Hugging Face ID; staging otherwise refuses it. Recorded on the
            adapter. A base imported from S3 has no ID to compare.

    CustomModelUpdate:
      type: object
      additionalProperties: false
      description: |
        Partial-update payload for `PATCH /v1/{workspaceId}/custom-models/{modelId}`.
        All fields are independently optional; omitted fields are left
        unchanged. At least one field MUST be supplied.

        Only a small, vetted set of fields are mutable post-create.
        Immutable fields (`huggingface_model_id`, `weight_source`,
        GPU topology, …) are not exposed here — change them by
        deleting and re-creating the model.
      properties:
        name:
          type: string
          description: Display name. Persisted to the model record only.
        min_replicas:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            New floor for the autoscaler. `0` re-enables scale-to-zero;
            any value `>= 1` keeps the model warm. Applied to the live
            deployment in place — no rolling restart, no downtime.
        max_replicas:
          type: integer
          minimum: 1
          maximum: 8
          description: |
            New ceiling for the autoscaler, applied to the live
            deployment in place.
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Idle period (in seconds) the controller waits before scaling
            an idle replica back to zero. Persisted to the model record;
            the controller picks it up on the next reconcile.

    CustomModelList:
      type: object
      additionalProperties: true
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomModel' }
        total:
          type: integer
          description: Number of items in this page (not the global total).
        continue_token:
          type: string
          description: Opaque cursor for the next page; absent when no more pages.

    CustomModelAccess:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
          description: Whether the workspace may import custom models.
        reason:
          type: string
          enum: [admin_disabled, purchase_required]
          description: |
            Why `allowed` is false, when graphn-cp's own gate refused before
            the allowlist was consulted.
        shared_lora:
          type: boolean
          description: |
            Preview. Present and `true` when this deployment admits shared
            LoRA bases (`lora_enabled` on create) and adapter attaches.

    GpuHoursResponse:
      type: object
      additionalProperties: false
      required: [gpu_hours]
      properties:
        gpu_hours:
          type: number
          minimum: 0
          description: |
            Cumulative GPU-hours consumed by this model. For an adapter, the
            base's: an adapter bills no GPU time of its own.
        shared:
          type: boolean
          description: Preview. `true` when `gpu_hours` is an adapter's base's.
        parent_model_id:
          type: string
          description: Preview. With `shared`, the base the hours belong to.

    ValidateModelRequest:
      type: object
      additionalProperties: false
      required: [huggingface_model_id]
      properties:
        weight_source:
          type: string
          enum: [huggingface, s3_assume_role]
          default: huggingface
          description: |
            Which validation path to run. `huggingface` (default) queries
            the HuggingFace Hub API. `s3_assume_role` assumes your role
            with its ExternalId, as the import does, and reads
            `<s3_url>config.json` directly, so an unsupported
            architecture surfaces before any download starts.
            `s3_presigned` is intentionally not accepted: presigned
            URLs deliver a single archive object and architecture
            detection requires the full extract.
        huggingface_model_id:
          type: string
          minLength: 3
          maxLength: 200
          description: |
            Required when `weight_source` is `huggingface`. Carried
            through on the `s3_assume_role` path as the canonical
            model identifier (used for naming + LoRA classification
            hints), but architecture detection comes from `config.json`
            in the customer's bucket, not the HF Hub.
        s3_url:
          type: string
          maxLength: 2048
          nullable: true
          description: |
            S3 prefix (must end with `/`). Required when
            `weight_source` is `s3_assume_role`. Points at the
            directory containing `config.json` + safetensors in
            HuggingFace layout. The import copies the whole prefix,
            so a single archive object is rejected at the API
            boundary.
        s3_role_arn:
          type: string
          nullable: true
          pattern: "^arn:aws:iam::[0-9]{12}:role/(?:[\\w+=,.@\\-]+/)*graphn-byom-[\\w+=,.@\\-]+$"
          description: |
            Customer IAM role ARN. Required when `weight_source` is
            `s3_assume_role`. Role name must start with `graphn-byom-`
            (the platform IAM is scoped to that prefix as
            defense-in-depth).
        s3_external_id:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9+/=_\\-]{16,256}$"
          description: |
            ExternalId from the customer's IAM trust policy. Required
            when `weight_source` is `s3_assume_role`.
        hf_token_secret_id:
          type: string
          nullable: true
          description: ID of a workspace secret holding a HuggingFace token.
        quantization:
          type: string
          nullable: true
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.9
        model_size_gb:
          type: integer
          nullable: true
          minimum: 1
          maximum: 500
          description: |
            Optional caller-supplied estimate of the on-disk weights size,
            in GiB. When provided, the platform sizes the model-weights PVC
            from this hint instead of waiting for a HuggingFace head-bytes
            probe; useful for very large models where the probe would
            otherwise stall the validate response.
        base_model_id:
          type: string
          nullable: true
          maxLength: 200
          description: |
            LoRA base override / hint, mirroring
            `CustomModelCreate.base_model_id`. When the validator
            detects a LoRA adapter and this field is set, the
            override **wins** over
            `adapter_config.json::base_model_name_or_path` -- so the
            allowlist check and the base-model sizing probe both run
            against the override. Useful for adapters whose adapter
            config records a local filesystem path
            (e.g. `C:/users/.../base`) that isn't a valid HF id.
            Silently ignored when the validator resolves the repo as
            a full model (`artifact_type=base`).

    ValidateModelResponse:
      type: object
      additionalProperties: true
      required: [valid]
      properties:
        valid: { type: boolean }
        error:
          type: string
          nullable: true
          description: Populated when `valid` is `false`.
        architectures:
          type: array
          items: { type: string }
        supports_mtp:
          type: boolean
          description: Whether the model architecture supports native MTP speculative decoding.
        num_params:
          type: integer
          nullable: true
        estimated_memory_gb:
          type: number
          nullable: true
        max_context_length:
          type: integer
          nullable: true
        artifact_type:
          type: string
          enum: [base, lora]
          default: base
          description: |
            `lora` when validation found an `adapter_config.json` in the HuggingFace
            repo at validate time; `base` otherwise (the default — what every
            existing caller saw before the LoRA auto-detect work landed). Use
            this to branch in client code without keeping track of two
            different `weight_source` enum values for the HF case.

            When `artifact_type=lora`, the `architectures`, `num_params`,
            `estimated_memory_gb`, and `max_context_length` fields describe
            the **base** model (resolved from `adapter_config.json`), not
            the adapter itself.
        detected_base_model_id:
          type: string
          nullable: true
          description: |
            Populated only when `artifact_type=lora`. The base model id read
            from `adapter_config.json::base_model_name_or_path`. Use to pin
            the base on subsequent deploy calls or to surface a "detected as
            LoRA adapter for X" affordance in your UI.
        lora_rank:
          type: integer
          nullable: true
          description: |
            Populated only when `artifact_type=lora`. The `r` value from
            `adapter_config.json` (LoRA rank).

    ArchitectureInfo:
      type: object
      additionalProperties: false
      required: [name, capabilities]
      properties:
        name:
          type: string
          description: |
            HuggingFace `architectures[0]` value (e.g. `LlamaForCausalLM`,
            `Qwen3VLMoeForConditionalGeneration`).
        capabilities:
          type: array
          items: { type: string }
          description: |
            Capability tags this architecture exposes — `tool_calling`,
            `vision`, `image_input`, `video_input`, `streaming`, `json_mode`.
            Drives the console's capability filters and per-feature gating.

    SupportedArchitectures:
      type: object
      additionalProperties: false
      required: [architectures]
      properties:
        architectures:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureInfo'
          description: |
            Sorted (by `name`) list of architectures the platform's serving
            runtimes can deploy.

    Secret:
      type: object
      additionalProperties: true
      description: |
        Workspace secret record. Additional internal fields may be
        present and are not part of the public contract.
      required: [id, workspace_id, name, value_preview, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 100
        value_preview:
          type: string
          description: |
            First few characters of the secret value, suitable for UI
            disambiguation. The full plaintext value is never returned.
        provider_id:
          type: string
          description: Optional connector / provider this secret belongs to.
        field_name:
          type: string
          description: Optional connector field name.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecretCreate:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 100
        value:
          type: string
          minLength: 1
          description: Plaintext secret value. Encrypted at rest.
        provider_id: { type: string }
        field_name: { type: string }

    SecretUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          description: New plaintext value.

    SecretList:
      type: object
      additionalProperties: true
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Secret' }
        count:
          type: integer
          description: Number of items in this page.
        continue_token:
          type: string

    ConnectionCreate:
      type: object
      additionalProperties: false
      required: [name, kind, provider_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum: [native, mcp]
        provider_id:
          type: string
          pattern: '^[a-zA-Z][a-zA-Z0-9_-]*$'
          maxLength: 64
        resource_id:
          type: string
          description: Optional linked MCP resource ID.

    Connection:
      type: object
      additionalProperties: false
      description: |
        Workspace-owned authorization metadata. OAuth client secrets, access
        tokens, refresh tokens, PKCE data, and account hashes are never returned.
      required:
        - id
        - workspace_id
        - name
        - kind
        - provider_id
        - status
        - granted_capabilities
        - granted_scopes
        - watch_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^conn_[a-zA-Z0-9_-]+$'
        workspace_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [native, mcp]
        provider_id:
          type: string
        resource_id:
          type: string
        status:
          type: string
          enum: [pending, active, needs_reauth, revoked, error]
        account_label:
          type: string
        account_metadata:
          type: object
          additionalProperties:
            type: string
        granted_capabilities:
          type: array
          items: { type: string }
        granted_scopes:
          type: array
          items: { type: string }
        credential_expires_at:
          type: string
          format: date-time
        last_validated_at:
          type: string
          format: date-time
        last_error_code:
          type: string
        last_error_message:
          type: string
        watch_status:
          type: string
          enum: [disabled, pending, active, error]
        watch_expires_at:
          type: string
          format: date-time
        last_event_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConnectionList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        count:
          type: integer
        continue_token:
          type: string

    ConnectionAuthorizationStart:
      type: object
      additionalProperties: false
      properties:
        return_path:
          type: string
          default: /settings/connections
          description: Relative path on the configured GraphN web origin.
        requested_capabilities:
          type: array
          items: { type: string }

    ConnectionAuthorizationChallenge:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    ManagedConnectionToolCall:
      type: object
      additionalProperties: false
      required: [resource_id, version_id, arguments]
      properties:
        resource_id:
          type: string
          pattern: '^mcp_[a-zA-Z0-9_-]+$'
        version_id:
          type: string
          pattern: '^rv_[a-zA-Z0-9_-]+$'
        arguments:
          type: object
          additionalProperties: true

    ManagedConnectionToolResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
        output: {}

    IntegrationCapability:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }

    IntegrationEvent:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        capability: { type: string }

    Integration:
      type: object
      additionalProperties: false
      required: [id, display_name, kind, auth_mode, capabilities, events]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [native, mcp]
        auth_mode:
          type: string
          enum: [oauth2]
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/IntegrationCapability' }
        events:
          type: array
          items: { $ref: '#/components/schemas/IntegrationEvent' }

    IntegrationList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Integration' }
        count:
          type: integer

    ChatMessage:
      type: object
      additionalProperties: true
      description: |
        OpenAI chat message. `content` may be a string, an array of
        content parts (text + image / audio / video), or null when
        `tool_calls` is set. See the OpenAI Chat Completions reference
        for the canonical shape; we forward the entire object unchanged.
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        name: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items: { type: object, additionalProperties: true }

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      description: |
        OpenAI-compatible chat completion request. Additional fields not
        listed here are forwarded to the upstream model unchanged. See
        the OpenAI Chat Completions reference for the full set.
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Model name (built-in alias or custom model `name`). For
            imported models, use `imported:<id>`; for custom models you
            may use either `<name>` or `custom:<id>`.
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
          minItems: 1
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        tool_choice:
          oneOf:
            - { type: string }
            - { type: object, additionalProperties: true }
        response_format:
          type: object
          additionalProperties: true
        stop:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        n:
          type: integer
          minimum: 1
          default: 1
        seed:
          type: integer
        user:
          type: string

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      description: |
        OpenAI-compatible chat completion response. Additional fields
        from the upstream model are forwarded unchanged.
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          description: Unix timestamp.
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [index, message]
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason:
                type: string
                nullable: true
        usage:
          type: object
          additionalProperties: true
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id: { type: string }
        object:
          type: string
          enum: [model]
        created:
          type: integer
          description: Unix timestamp.
        owned_by:
          type: string
          enum: [built-in, imported, custom]

    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items: { $ref: '#/components/schemas/Model' }

    TTSRequest:
      type: object
      additionalProperties: false
      required: [model, text, speaker]
      properties:
        model:
          type: string
          description: TTS model alias (built-in) or `custom:<id>` / `imported:<id>`.
        text:
          type: string
          minLength: 1
          description: Text to synthesize.
        speaker:
          type: string
          description: Voice identifier from `listTtsVoices`.
        lang:
          type: string
          description: ISO-639-1 language code.
        samplingRate:
          type: integer
          description: Output sampling rate in Hz (Rime providers).
          default: 24000
        speedAlpha:
          type: number
          description: Playback speed multiplier (1.0 = normal).
        responseFormat:
          type: string
          enum: [wav, mp3, opus, flac, pcm]
          description: Output audio format (Qwen providers).
        topP:
          type: number
        temperature:
          type: number
        repetitionPenalty:
          type: number
        maxTokens:
          type: integer
        instructions:
          type: string
          description: Style/instruction prompt (Qwen providers).

    DiscoverImportedModelsRequest:
      type: object
      additionalProperties: false
      required: [endpoint, api_key_secret_id]
      properties:
        endpoint:
          type: string
          format: uri
          description: Base URL of the OpenAI-compatible endpoint.
        api_key_secret_id:
          type: string
          description: Workspace secret containing the upstream API key.

    DiscoveredImportedModel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DiscoverImportedModelsResponse:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/DiscoveredImportedModel' }

    TestConnectionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, model_id]
      properties:
        endpoint:
          type: string
          format: uri
        model_id:
          type: string
          description: Upstream model identifier to test against.
        api_key_secret_id:
          type: string
          description: Workspace secret with the upstream API key. Optional for unauthenticated endpoints.
        message:
          type: string
          description: Test prompt. Defaults to `"Hello, respond in one sentence."`.

    TestConnectionResponse:
      type: object
      additionalProperties: false
      required: [response, model]
      properties:
        response:
          type: string
          description: Text content of the upstream response.
        model:
          type: string
          description: Model id echoed back by the upstream.
        usage:
          type: object
          additionalProperties: true
          description: Optional token usage stats from the upstream.

