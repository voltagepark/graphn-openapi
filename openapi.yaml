      tags: [objects]
      summary: Probe object size and range support
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      responses:
        '200':
          description: Object exists.
          headers:
            Accept-Ranges:
              schema: {type: string}
            Content-Length:
              schema: {type: integer, format: int64}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      operationId: getObject
      tags: [objects]
      summary: Download an object
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Object bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Partial content.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: putObject
      tags: [objects]
      summary: Upload an object (single-shot)
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploadId
          in: query
          schema: {type: string}
        - name: partNumber
          in: query
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Uploaded. MPU part responses include an ETag header that must be echoed at complete.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Delete an object or abort an MPU
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploadId
          in: query
          schema: {type: string}
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: postObject
      tags: [objects]
      summary: MPU init/complete or mint a presigned URL
      description: |
        Query-string dispatch:
        
        - `?uploads` — initiate multipart upload.
        - `?uploadId=` — complete MPU. Body `{ "parts":[{"part_number":N,"etag":"..."}] }`.
        - `?type=download&expires=SEC` — presigned GET.
        - `?type=upload&expires=&max-size=&content-type=` — presigned PUT.
        - `?type=upload_part&upload_id=&part_number=` — presigned MPU part.
      servers:
        - url: https://storage.graphn.ai
          description: Object storage
          x-graphn-name: storage
      parameters:
        - name: uploads
          in: query
          schema: {type: string}
        - name: uploadId
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string, enum: [download, upload, upload_part]}
        - name: expires
          in: query
          schema: {type: integer}
        - name: max-size
          in: query
          schema: {type: integer}
        - name: content-type
          in: query
          schema: {type: string}
        - name: upload_id
          in: query
          schema: {type: string}
        - name: part_number
          in: query
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MpuCompleteRequest'
            examples:
              default:
                value:
                  parts: [{'part_number': 1, 'etag': 'abc'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePostResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: graphn-api-key
      description: |
        Workspace-scoped API key issued in the Graphn dashboard. Format:
        `Authorization: Bearer gn_...`.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace identifier the request is scoped to.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        minLength: 1
      example: ws_01HABCXYZ
    WorkspaceIdHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: |
        Workspace identifier. Optional when the API key itself is
        workspace-scoped (the standard case); required only when calling
        with an unscoped or system credential.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
    ModelId:
      name: modelId
      in: path
      required: true
      description: Custom model identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
      example: cm_01HABCXYZ
    SecretId:
      name: secretId
      in: path
      required: true
      description: Secret identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
      example: sec_01HABCXYZ
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ContinueToken:
      name: continue_token
      in: query
      required: false
      description: |
        Opaque pagination cursor returned by a previous list response.
        Pass back unchanged to fetch the next page.
      schema:
        type: string

    AgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    FunctionId:
      name: functionId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    ServerId:
      name: serverId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    TriggerId:
      name: triggerId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    ImportedModelId:
      name: importedModelId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    KbId:
      name: kbId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    DocId:
      name: docId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    OrgId:
      name: orgId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    KeyId:
      name: keyId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$', minLength: 1}
    StoreName:
      name: storeName
      in: path
      required: true
      schema: {type: string, minLength: 1}
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Bucket:
      name: bucket
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ObjectKey:
      name: key
      in: path
      required: true
      description: Object key. Slash-separated segments should be percent-encoded.
      schema: {type: string, minLength: 1}

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: missing or invalid API key
    Forbidden:
      description: API key is valid but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: API key is not valid for this workspace
    NotFound:
      description: Resource does not exist or is not visible to this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: custom model not found
    Conflict:
      description: Resource conflict (duplicate name, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NAME_CONFLICT
            message: a custom model with this name already exists
    ValidationError:
      description: Request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 'huggingface_model_id is required for all weight_source values (canonical model identifier)'
    InferenceBadRequest:
      description: Inference request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    InferenceNotFound:
      description: Model could not be resolved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    InferenceUnavailable:
      description: |
        Custom model is not in the `ready` state (still deploying,
        scaled to zero, or failed). Call `wakeCustomModel` if scaled
        to zero, or `getCustomModel` to inspect the current `status`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceError'
    BadGateway:
      description: Upstream service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AF_ERROR
            message: upstream execution engine unavailable

  schemas:
    BillingAccount:
      type: object
      required: [orgId, stripeCustomerId, billingEmail, rechargeAmountCents, autoRechargeEnabled, hasPurchased]
      properties:
        orgId: {type: string}
        stripeCustomerId: {type: string}
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64}
        hasPurchased: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
    BillingSettingsUpdate:
      type: object
      properties:
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64, minimum: 0}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64, minimum: 1}
    BillingTopUpRequest:
      type: object
      required: [amountCents, idempotencyKey]
      properties:
        amountCents: {type: integer, format: int64, minimum: 1}
        idempotencyKey: {type: string, minLength: 1}
    BillingGrantResult:
      type: object
      required: [alreadyDone, omGrantId, newBalanceCents, newStatus]
      properties:
        alreadyDone: {type: boolean}
        paymentIntentId: {type: string}
        omGrantId: {type: string}
        newBalanceCents: {type: integer, format: int64}
        newStatus: {type: string, enum: [ok, low, out_of_balance]}
    PaymentMethod:
      type: object
      required: [id, brand, last4, expMonth, expYear, isDefault]
      properties:
        id: {type: string}
        brand: {type: string}
        last4: {type: string}
        expMonth: {type: integer}
        expYear: {type: integer}
        isDefault: {type: boolean}
    Invoice:
      type: object
      required: [id, number, status, amountDue, currency, created, periodStart, periodEnd]
      properties:
        id: {type: string}
        number: {type: string}
        status:
          type: string
          enum: [closed, current]
        amountDue: {type: integer, format: int64}
        currency: {type: string}
        created: {type: integer, format: int64}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        openingCents: {type: integer, format: int64}
        usageCents: {type: integer, format: int64}
        creditsCents: {type: integer, format: int64}
        closingCents: {type: integer, format: int64}
        hostedInvoiceUrl: {type: string}
        invoicePdf: {type: string}
        invoiceDocumentUrl: {type: string}
    FreeGrantResult:
      type: object
      required: [balanceCents, balanceStatus, alreadyClaimed]
      properties:
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        alreadyClaimed: {type: boolean}
    BillingEntitlements:
      type: object
      required: [balanceCents, balanceStatus, hasPurchased]
      properties:
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        hasPurchased: {type: boolean}
        allowNegativeBalance:
          type: boolean
          description: >-
            True when the org is permitted to run below zero (invoice terms). A
            negative balanceCents is expected usage for these orgs, not a debt
            blocking them.
        negativeLimitCents:
          type: integer
          format: int64
          description: >-
            Positive magnitude of how far below zero the org may run; the org is
            blocked at -negativeLimitCents. Omitted when the allowance is
            uncapped, and meaningless when allowNegativeBalance is false.
        freeGrantStatus: {type: string}
    BillingUsage:
      type: object
      required: [totalSpendCents, currentPeriodStart, currentPeriodEnd, nextBillingDate, timeSeries]
      properties:
        totalSpendCents: {type: integer, format: int64}
        currentPeriodStart: {type: string, format: date-time}
        currentPeriodEnd: {type: string, format: date-time}
        nextBillingDate: {type: string}
        timeSeries:
          type: array
          items:
            type: object
            required: [timestamp, amountCents]
            properties:
              timestamp: {type: string, format: date-time}
              amountCents: {type: integer, format: int64}
    AdminBillingState:
      type: object
      required: [orgId, billingAccountExists, balanceCents, balanceStatus]
      properties:
        orgId: {type: string}
        billingAccountExists: {type: boolean}
        balanceCents: {type: integer, format: int64}
        balanceStatus: {type: string}
        stripeCustomerId: {type: string}
        billingEmail: {type: string}
        rechargeAmountCents: {type: integer, format: int64}
        autoRechargeEnabled: {type: boolean}
        autoRechargeThresholdCents: {type: integer, format: int64}
        hasPurchased: {type: boolean}
        customModelsDisabled: {type: boolean}
        allowNegativeBalance: {type: boolean}
        negativeLimitCents: {type: integer, format: int64}
    AdminBillingOverrides:
      type: object
      required: [comment]
      properties:
        customModelsDisabled: {type: boolean}
        allowNegativeBalance: {type: boolean}
        negativeLimitCents: {type: integer, format: int64}
        hasPurchased: {type: boolean}
        comment: {type: string, minLength: 1, maxLength: 2000}
    AdminBillingGrantRequest:
      type: object
      required: [amountCents, comment]
      properties:
        amountCents: {type: integer, format: int64}
        comment: {type: string, minLength: 1, maxLength: 2000}
        idempotencyKey: {type: string}

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error description.

    InferenceError:
      type: object
      description: |
        OpenAI-style error envelope returned by the inference host. The
        shape mirrors the OpenAI API for compatibility with existing
        OpenAI client libraries.
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: string, nullable: true }
            code: { type: string, nullable: true }

    WeightSource:
      type: string
      enum: [huggingface, s3_presigned, s3_assume_role]
      description: |
        Source of the model weights:
        - `huggingface`: download from HuggingFace using `huggingface_model_id`
        - `s3_presigned`: download from a presigned S3 URL
        - `s3_assume_role`: download from S3 using an assumed IAM role

    Capability:
      type: string
      enum: [tool_calling, vision, embedding, reasoning]
      description: A model capability tag used for filtering and routing.

    CustomModelStatus:
      type: string
      enum: [pending, deploying, ready, failed, deleting]
      description: |
        Lifecycle state:
        - `pending`: record created, deployment not yet started
        - `deploying`: weights downloading, replicas booting
        - `ready`: at least one replica is serving (or scaled to zero with cooldown)
        - `failed`: deployment failed; see `error_message`
        - `deleting`: teardown in progress

    CustomModel:
      type: object
      additionalProperties: true
      description: |
        Public custom model record. Additional internal fields may be
        present in responses but are not documented and may change
        without notice. Generated SDKs ignore them.
      required:
        - id
        - name
        - workspace_id
        - status
        - weight_source
        - gpu_count
        - capabilities
        - min_replicas
        - max_replicas
        - cooldown_seconds
        - gpu_memory_utilization
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Stable model identifier (`cm_...`).
        name:
          type: string
          description: |
            URL-safe model name. Pass this as the `model` field on
            `createChatCompletion` once `status` is `ready`.
          pattern: '^[a-zA-Z0-9_\-/:.]+$'
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          description: Human-friendly name for UI display.
        workspace_id: { type: string }
        status: { $ref: '#/components/schemas/CustomModelStatus' }
        weight_source: { $ref: '#/components/schemas/WeightSource' }
        huggingface_model_id:
          type: string
          description: Set when `weight_source` is `huggingface`.
        s3_url:
          type: string
          nullable: true
          description: Set when `weight_source` is `s3_presigned` or `s3_assume_role`.
        s3_role_arn:
          type: string
          nullable: true
          description: Set when `weight_source` is `s3_assume_role`.
        artifact_type:
          type: string
          nullable: true
          enum: [base, lora]
          description: |
            Whether this import is a full base checkpoint or a LoRA
            adapter on top of an allowlisted base. Set eagerly at
            create-time:

            * **`huggingface`** imports are classified by probing
              `adapter_config.json` on the upstream repo.
            * **`s3_*`** imports are classified as `lora` iff
              `base_model_id` is supplied on the create request;
              otherwise the bundle is treated as `base`. If the
              downloaded S3 bundle later turns out to be a LoRA
              adapter (caller forgot the hint), the model deploys to
              `failed` with an actionable `error_message`.
        base_model_id:
          type: string
          nullable: true
          description: |
            Populated when `artifact_type=lora`. The base model id the
            adapter loads on top of. For HuggingFace imports this is
            either `adapter_config.json::base_model_name_or_path` or
            the caller's `base_model_id` override on
            `CustomModelCreate` (the override wins on disagreement).
            For S3 imports it is the caller-supplied
            `base_model_id` from `CustomModelCreate`.
        lora_adapter_name:
          type: string
          nullable: true
          description: |
            vLLM routing name the LoRA adapter is served under.
            Defaults to the model's short name; clients address it
            via `model=<lora_adapter_name>` in chat completions.
        lora_rank:
          type: integer
          nullable: true
          description: |
            `r` value from `adapter_config.json` when `artifact_type=lora`.
        gpu_count:
          type: integer
          minimum: 1
          description: Number of GPUs allocated per replica.
        max_model_len:
          type: integer
          nullable: true
          description: Maximum context length in tokens.
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          description: Fraction of GPU memory the inference runtime is allowed to use.
        quantization:
          type: string
          nullable: true
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
          description: Weight quantization scheme, if any.
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        min_replicas:
          type: integer
          minimum: 0
          maximum: 3
          description: Minimum replicas to keep warm. `0` allows scale-to-zero.
        max_replicas:
          type: integer
          minimum: 1
          maximum: 3
          description: Maximum replicas the autoscaler may run.
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Idle seconds before scaling down to `min_replicas`.
        replicas_available:
          type: integer
          nullable: true
          description: Currently serving replicas (live status).
        endpoint:
          type: string
          nullable: true
          description: Internal cluster endpoint serving this model. Informational only — clients should use `chat.completions` with the model's `name`.
        error_message:
          type: string
          nullable: true
          description: Populated when `status` is `failed`.
        num_params:
          type: integer
          nullable: true
          description: Parameter count detected from the model config.
        estimated_memory_gb:
          type: number
          nullable: true
          description: Estimated GPU memory required for serving.
        architectures:
          type: array
          nullable: true
          items: { type: string }
          description: HuggingFace `architectures` field from `config.json`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomModelCreate:
      type: object
      additionalProperties: false
      required: [name, huggingface_model_id]
      properties:
        name:
          type: string
          description: |
            URL-safe model name; use this when calling `chat.completions`
            once the model is `ready`. Must be unique within the workspace.
          pattern: '^[a-zA-Z0-9_\-/:.]+$'
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          maxLength: 100
          description: Human-friendly name for UI display. Defaults to `name`.
        weight_source:
          $ref: '#/components/schemas/WeightSource'
          default: huggingface
        huggingface_model_id:
          type: string
          minLength: 3
          maxLength: 200
          description: |
            Canonical model identifier (`org/model-name`). **Required
            for every `weight_source`**: this is the name the inference
            endpoint advertises and the value clients pass in `model`
            for chat completions, so without it the deployed model has
            no stable name to address via inference. For `huggingface`
            it also drives the download; for the S3 sources it mirrors
            the "Model ID" field in the web UI's S3 import flow.
          example: meta-llama/Llama-3-8B-Instruct
        s3_url:
          type: string
          maxLength: 2048
          description: |
            Required when `weight_source` is `s3_presigned` or
            `s3_assume_role`. Conditional requirement is enforced by
            the server (returns 422); not encoded as a JSON Schema
            keyword for OAS-3.0-tooling compatibility.
        s3_role_arn:
          type: string
          pattern: '^arn:aws:iam::\d{12}:role/(?:[\w+=,.@-]+/)*graphn-byom-[\w+=,.@-]+$'
          description: |
            Required when `weight_source` is `s3_assume_role`. The role
            name (the segment after `:role/`) must start with
            `graphn-byom-`; GraphN's platform IAM policy is scoped to
            that prefix as a defense-in-depth boundary, and the
            customer-facing CloudFormation template enforces the same
            constraint at stack-create time. Conditional requirement
            (s3_assume_role only) is enforced by the server (returns
            422); the format itself is checked against this pattern.
        hf_token_secret_id:
          type: string
          description: |
            ID of a workspace secret holding a HuggingFace access token.
            Required for gated HuggingFace models.
        gpu_count:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
        max_model_len:
          type: integer
          minimum: 256
          maximum: 262144
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.9
        quantization:
          type: string
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
          default: [tool_calling]
        min_replicas:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        max_replicas:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
        base_model_id:
          type: string
          maxLength: 200
          description: |
            Override / hint for LoRA imports. Must be one of the
            platform's allowlisted base models (see
            `GET /v1/{workspaceId}/custom-models/supported-architectures`).

            * **`weight_source=s3_*`**: this is the **only** way to
              classify the bundle as a LoRA adapter at create-time --
              omitting it routes the import through the base path,
              and a bundle that later turns out to be a LoRA adapter
              will deploy to `failed` with an actionable error
              ("re-create with `base_model_id` set").
            * **`weight_source=huggingface`**: the field **overrides**
              `adapter_config.json::base_model_name_or_path` from the
              adapter repo. Useful for adapters trained against a
              local filesystem path (e.g. `C:/users/.../base`) whose
              recorded base id isn't a valid HF id. When the override
              disagrees with the adapter's declared base the caller's
              value wins; the disagreement is logged server-side for
              debuggability.

            Ignored when the resolved artifact type is `base`.
          example: Qwen/Qwen3.5-4B

    CustomModelUpdate:
      type: object
      additionalProperties: false
      description: |
        Partial-update payload for `PATCH /v1/{workspaceId}/custom-models/{modelId}`.
        All fields are independently optional; omitted fields are left
        unchanged. At least one field MUST be supplied.

        Only a small, vetted set of fields are mutable post-create.
        Immutable fields (`huggingface_model_id`, `weight_source`,
        GPU topology, …) are not exposed here — change them by
        deleting and re-creating the model.
      properties:
        name:
          type: string
          description: Display name. Persisted to the model record only.
        min_replicas:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            New floor for the autoscaler. `0` re-enables scale-to-zero;
            any value `>= 1` keeps the model warm. Applied to the live
            deployment in place — no rolling restart, no downtime.
        max_replicas:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            New ceiling for the autoscaler. KServe propagates the value
            to the underlying KEDA `ScaledObject`'s `maxReplicaCount` on
            its next reconcile. Applied to the live deployment in place.
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Idle period (in seconds) the controller waits before scaling
            an idle replica back to zero. Persisted to the model record;
            the controller picks it up on the next reconcile.

    CustomModelList:
      type: object
      additionalProperties: true
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomModel' }
        total:
          type: integer
          description: Number of items in this page (not the global total).
        continue_token:
          type: string
          description: Opaque cursor for the next page; absent when no more pages.

    CustomModelAccess:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
          description: Whether the workspace may import custom models.

    GpuHoursResponse:
      type: object
      additionalProperties: false
      required: [gpu_hours]
      properties:
        gpu_hours:
          type: number
          minimum: 0
          description: Cumulative GPU-hours consumed by this model.

    ValidateModelRequest:
      type: object
      additionalProperties: false
      required: [huggingface_model_id]
      properties:
        weight_source:
          type: string
          enum: [huggingface, s3_assume_role]
          default: huggingface
          description: |
            Which validation path to run. `huggingface` (default) queries
            the HuggingFace Hub API. `s3_assume_role` chains the same
            two-hop AssumeRole the smart-loader uses (bootstrap user
            → platform role → customer role with ExternalId) and
            probes `<s3_url>config.json` directly, so an unsupported
            architecture surfaces before AF provisions a download Job.
            `s3_presigned` is intentionally not accepted: presigned
            URLs deliver a single archive object and architecture
            detection requires the full extract.
        huggingface_model_id:
          type: string
          minLength: 3
          maxLength: 200
          description: |
            Required when `weight_source` is `huggingface`. Carried
            through on the `s3_assume_role` path as the canonical
            model identifier (used for naming + LoRA classification
            hints), but architecture detection comes from `config.json`
            in the customer's bucket, not the HF Hub.
        s3_url:
          type: string
          maxLength: 2048
          nullable: true
          description: |
            S3 prefix (must end with `/`). Required when
            `weight_source` is `s3_assume_role`. Points at the
            directory containing `config.json` + safetensors in
            HuggingFace layout; the smart-loader uses `aws s3 sync`
            on this path so a single archive object is rejected at
            the API boundary.
        s3_role_arn:
          type: string
          nullable: true
          pattern: "^arn:aws:iam::[0-9]{12}:role/(?:[\\w+=,.@\\-]+/)*graphn-byom-[\\w+=,.@\\-]+$"
          description: |
            Customer IAM role ARN. Required when `weight_source` is
            `s3_assume_role`. Role name must start with `graphn-byom-`
            (the platform IAM is scoped to that prefix as
            defense-in-depth).
        s3_external_id:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9+/=_\\-]{16,256}$"
          description: |
            ExternalId from the customer's IAM trust policy. Required
            when `weight_source` is `s3_assume_role`.
        hf_token_secret_id:
          type: string
          nullable: true
          description: ID of a workspace secret holding a HuggingFace token.
        quantization:
          type: string
          nullable: true
          enum: [awq, gptq, fp8, squeezellm, marlin, gguf]
        gpu_memory_utilization:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.9
        model_size_gb:
          type: integer
          nullable: true
          minimum: 1
          maximum: 500
          description: |
            Optional caller-supplied estimate of the on-disk weights size,
            in GiB. When provided, the platform sizes the model-weights PVC
            from this hint instead of waiting for a HuggingFace head-bytes
            probe; useful for very large models where the probe would
            otherwise stall the validate response.
        base_model_id:
          type: string
          nullable: true
          maxLength: 200
          description: |
            LoRA base override / hint, mirroring
            `CustomModelCreate.base_model_id`. When the validator
            detects a LoRA adapter and this field is set, the
            override **wins** over
            `adapter_config.json::base_model_name_or_path` -- so the
            allowlist check and the base-model sizing probe both run
            against the override. Useful for adapters whose adapter
            config records a local filesystem path
            (e.g. `C:/users/.../base`) that isn't a valid HF id.
            Silently ignored when the validator resolves the repo as
            a full model (`artifact_type=base`).

    ValidateModelResponse:
      type: object
      additionalProperties: true
      required: [valid]
      properties:
        valid: { type: boolean }
        error:
          type: string
          nullable: true
          description: Populated when `valid` is `false`.
        architectures:
          type: array
          items: { type: string }
        supports_mtp:
          type: boolean
          description: Whether the model architecture supports native MTP speculative decoding.
        num_params:
          type: integer
          nullable: true
        estimated_memory_gb:
          type: number
          nullable: true
        max_context_length:
          type: integer
          nullable: true
        artifact_type:
          type: string
          enum: [base, lora]
          default: base
          description: |
            `lora` when AF detected an `adapter_config.json` in the HuggingFace
            repo at validate time; `base` otherwise (the default — what every
            existing caller saw before the LoRA auto-detect work landed). Use
            this to branch in client code without keeping track of two
            different `weight_source` enum values for the HF case.

            When `artifact_type=lora`, the `architectures`, `num_params`,
            `estimated_memory_gb`, and `max_context_length` fields describe
            the **base** model (resolved from `adapter_config.json`), not
            the adapter itself.
        detected_base_model_id:
          type: string
          nullable: true
          description: |
            Populated only when `artifact_type=lora`. The base model id read
            from `adapter_config.json::base_model_name_or_path`. Use to pin
            the base on subsequent deploy calls or to surface a "detected as
            LoRA adapter for X" affordance in your UI.
        lora_rank:
          type: integer
          nullable: true
          description: |
            Populated only when `artifact_type=lora`. The `r` value from
            `adapter_config.json` (LoRA rank).

    ArchitectureInfo:
      type: object
      additionalProperties: false
      required: [name, capabilities]
      properties:
        name:
          type: string
          description: |
            HuggingFace `architectures[0]` value (e.g. `LlamaForCausalLM`,
            `Qwen3VLMoeForConditionalGeneration`).
        capabilities:
          type: array
          items: { type: string }
          description: |
            Capability tags this architecture exposes — `tool_calling`,
            `vision`, `image_input`, `video_input`, `streaming`, `json_mode`.
            Drives the UI capability filters and AF's per-feature gating.

    SupportedArchitectures:
      type: object
      additionalProperties: false
      required: [architectures]
      properties:
        architectures:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureInfo'
          description: |
            Sorted (by `name`) list of architectures the platform's serving
            runtimes can deploy.

    Secret:
      type: object
      additionalProperties: true
      description: |
        Workspace secret record. Additional internal fields may be
        present and are not part of the public contract.
      required: [id, workspace_id, name, value_preview, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 100
        value_preview:
          type: string
          description: |
            First few characters of the secret value, suitable for UI
            disambiguation. The full plaintext value is never returned.
        provider_id:
          type: string
          description: Optional connector / provider this secret belongs to.
        field_name:
          type: string
          description: Optional connector field name.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecretCreate:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 100
        value:
          type: string
          minLength: 1
          description: Plaintext secret value. Encrypted at rest.
        provider_id: { type: string }
        field_name: { type: string }

    SecretUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          description: New plaintext value.

    SecretList:
      type: object
      additionalProperties: true
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Secret' }
        count:
          type: integer
          description: Number of items in this page.
        continue_token:
          type: string

    ChatMessage:
      type: object
      additionalProperties: true
      description: |
        OpenAI chat message. `content` may be a string, an array of
        content parts (text + image / audio / video), or null when
        `tool_calls` is set. See the OpenAI Chat Completions reference
        for the canonical shape; we forward the entire object unchanged.
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        name: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items: { type: object, additionalProperties: true }

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      description: |
        OpenAI-compatible chat completion request. Additional fields not
        listed here are forwarded to the upstream model unchanged. See
        the OpenAI Chat Completions reference for the full set.
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Model name (built-in alias or custom model `name`). For
            imported models, use `imported:<id>`; for custom models you
            may use either `<name>` or `custom:<id>`.
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
          minItems: 1
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        tool_choice:
          oneOf:
            - { type: string }
            - { type: object, additionalProperties: true }
        response_format:
          type: object
          additionalProperties: true
        stop:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        n:
          type: integer
          minimum: 1
          default: 1
        seed:
          type: integer
        user:
          type: string

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      description: |
        OpenAI-compatible chat completion response. Additional fields
        from the upstream model are forwarded unchanged.
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          description: Unix timestamp.
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [index, message]
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason:
                type: string
                nullable: true
        usage:
          type: object
          additionalProperties: true
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id: { type: string }
        object:
          type: string
          enum: [model]
        created:
          type: integer
          description: Unix timestamp.
        owned_by:
          type: string
          enum: [built-in, imported, custom]

    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items: { $ref: '#/components/schemas/Model' }

    TTSRequest:
      type: object
      additionalProperties: false
      required: [model, text, speaker]
      properties:
        model:
          type: string
          description: TTS model alias (built-in) or `custom:<id>` / `imported:<id>`.
        text:
          type: string
          minLength: 1
          description: Text to synthesize.
        speaker:
          type: string
          description: Voice identifier from `listTtsVoices`.
        lang:
          type: string
          description: ISO-639-1 language code.
        samplingRate:
          type: integer
          description: Output sampling rate in Hz (Rime providers).
          default: 24000
        speedAlpha:
          type: number
          description: Playback speed multiplier (1.0 = normal).
        responseFormat:
          type: string
          enum: [wav, mp3, opus, flac, pcm]
          description: Output audio format (Qwen providers).
        topP:
          type: number
        temperature:
          type: number
        repetitionPenalty:
          type: number
        maxTokens:
          type: integer
        instructions:
          type: string
          description: Style/instruction prompt (Qwen providers).

    DiscoverImportedModelsRequest:
      type: object
      additionalProperties: false
      required: [endpoint, api_key_secret_id]
      properties:
        endpoint:
          type: string
          format: uri
          description: Base URL of the OpenAI-compatible endpoint.
        api_key_secret_id:
          type: string
          description: Workspace secret containing the upstream API key.

    DiscoveredImportedModel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DiscoverImportedModelsResponse:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/DiscoveredImportedModel' }

    TestConnectionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, model_id]
      properties:
        endpoint:
          type: string
          format: uri
        model_id:
          type: string
          description: Upstream model identifier to test against.
        api_key_secret_id:
          type: string
          description: Workspace secret with the upstream API key. Optional for unauthenticated endpoints.
        message:
          type: string
          description: Test prompt. Defaults to `"Hello, respond in one sentence."`.

    TestConnectionResponse:
      type: object
      additionalProperties: false
      required: [response, model]
      properties:
        response:
          type: string
          description: Text content of the upstream response.
        model:
          type: string
          description: Model id echoed back by the upstream.
        usage:
          type: object
          additionalProperties: true
          description: Optional token usage stats from the upstream.

