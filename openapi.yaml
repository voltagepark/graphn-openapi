openapi: 3.1.0
info:
  title: Graphn API
  version: 0.7.0
  description: |
    Public API for the Graphn AI platform.

    The Graphn API is the customer-facing surface for the agent platform:
    workflows, agents, functions, MCP servers, knowledge bases, executions,
    triggers, storage, organizations, and OpenAI-compatible inference
    (chat completions, model listings, and TTS).

    ## Hosts

    The API is split across four hosts. Operations are tagged and use
    per-operation `servers` overrides so generated SDKs that respect
    OpenAPI 3.1 per-operation `servers` (openapi-python-client >= 0.20,
    openapi-generator >= 6.0, oapi-codegen >= 1.16, @hey-api/openapi-ts)
    route correctly out of the box.

    - **Control plane** (`https://cp.graphn.ai`) — workspace-scoped CRUD
      for agents, functions, MCP servers, workflows, knowledge bases,
      secrets, custom models, storage buckets, organizations, and billing.
    - **Inference** (`https://model.graphn.ai`) — OpenAI-compatible
      chat completions, model listings, and TTS.
    - **Gateway** (`https://gateway.graphn.ai`) — async workflow runs,
      batch jobs, and UUID-keyed execution polling / cancel.
    - **Storage** (`https://storage.graphn.ai`) — S3-style object API
      used by the CLI (`graphn storage`). The control plane also exposes
      a REST overlay at `/v1/{workspaceId}/storages`.

    ## Authentication

    All endpoints require a workspace-scoped API key passed as
    `Authorization: Bearer gn_...`. Create keys in the Graphn dashboard
    or via `createApiKey`. Send `X-Workspace-Id` when the key is not
    already workspace-scoped.

    ## Errors

    Control-plane errors return a JSON envelope:

    ```json
    { "code": "NOT_FOUND", "message": "model not found" }
    ```

    The `code` field is a machine-readable identifier; `message` is
    intended for end-user display. Inference errors use the OpenAI-style
    `InferenceError` envelope.
  contact:
    name: Graphn OpenAPI Issues
    url: https://github.com/voltagepark/graphn-openapi/issues
  license:
    name: Proprietary
servers:
  - url: https://cp.graphn.ai
    description: Control plane (default)
    x-graphn-name: control-plane
  - url: https://model.graphn.ai
    description: Inference
    x-graphn-name: inference
  - url: https://gateway.graphn.ai
    description: Gateway (async, batch, UUID executions)
    x-graphn-name: gateway
  - url: https://storage.graphn.ai
    description: Object storage (S3-style)
    x-graphn-name: storage
security:
  - ApiKeyAuth: []
tags:
  - name: custom-models
    description: |
      Manage custom model imports — register a HuggingFace or S3-hosted
      model, monitor its deployment, and tear it down. Inference against
      a `ready` custom model uses the `chat.completions` endpoint with
      the model's `name`.
  - name: secrets
    description: |
      Workspace-scoped opaque secrets (e.g. HuggingFace tokens, third-party
      API keys) referenced by other resources via their `id`.
  - name: chat
    description: OpenAI-compatible chat completions.
  - name: models
    description: List available models for a workspace.
  - name: tts
    description: Text-to-speech synthesis and voice catalog.
  - name: imported-models
    description: |
      Import an external OpenAI-compatible endpoint into a workspace,
      plus probe helpers (`discover-models`, `test-connection`) on the
      inference host.
  - name: billing
    description: Organization billing account, top-up, and usage operations.
  - name: admin-billing
    description: Administrative billing overrides and credit grants.
  - name: agents
    description: Workspace-scoped agent CRUD, publish, and run.
  - name: functions
    description: Workspace-scoped Python functions (FES sandboxes) and builtins.
  - name: mcp-servers
    description: Hosted and remote MCP servers, tools, and runtime control.
  - name: workflows
    description: Workflow CRUD, bundle, publish, versions, run, and test.
  - name: executions
    description: |
      Poll workflow executions. `exec_` / `test_` ids live on the control
      plane; UUID operation ids live on the gateway.
  - name: triggers
    description: Cron and webhook triggers that invoke a published workflow.
  - name: knowledgebases
    description: Vector knowledge bases, documents, search, and async ingest.
  - name: organizations
    description: Organizations the caller belongs to.
  - name: workspaces
    description: Workspaces inside an organization.
  - name: members
    description: Organization and workspace membership.
  - name: invitations
    description: Invite users to an organization or workspace.
  - name: api-keys
    description: Workspace-scoped API keys (`gn_...`).
  - name: blueprints
    description: Public workflow blueprint catalog and one-shot deploy.
  - name: connectors
    description: Connector catalog used when wiring third-party secrets.
  - name: embed
    description: Standalone text embeddings (same models as knowledge bases).
  - name: storages
    description: REST overlay for workspace object stores (UI / SDK).
  - name: objects
    description: S3-style object API on the storage host (CLI `graphn storage`).
  - name: batch
    description: Gateway batch jobs over a published workflow.
  - name: async
    description: Gateway async workflow runs (UUID operation ids).

paths:
  /v1/{workspaceId}/custom-models:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createCustomModel
      tags: [custom-models]
      summary: Register a new custom model
      description: |
        Begin import + deployment of a custom model. The response returns
        immediately with `status: "deploying"`. Poll `getCustomModel`
        (or use the SDK's `wait_until_ready`) until the status reaches
        `ready` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelCreate'
            examples:
              huggingface:
                summary: HuggingFace import
                value:
                  name: my-llama
                  huggingface_model_id: meta-llama/Llama-3-8B-Instruct
                  hf_token_secret_id: sec_01HABCXYZ
                  gpu_count: 1
                  max_replicas: 1
              s3PresignedUrl:
                summary: S3 presigned URL import
                value:
                  name: internal-model
                  weight_source: s3_presigned
                  huggingface_model_id: Qwen/Qwen3-0.6B
                  s3_url: https://my-bucket.s3.amazonaws.com/model.tar.gz?X-Amz-...
      responses:
        '201':
          description: Model accepted; deployment started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listCustomModels
      tags: [custom-models]
      summary: List custom models in a workspace
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
      responses:
        '200':
          description: A page of custom models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getCustomModel
      tags: [custom-models]
      summary: Get a custom model
      description: |
        Returns the latest known state of the custom model, enriched with
        live deployment status (replica counts, endpoint readiness).
      responses:
        '200':
          description: Custom model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomModel
      tags: [custom-models]
      summary: Delete a custom model
      description: |
        Tears down the deployment and removes the model record. Idempotent.
      responses:
        '204':
          description: Model deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCustomModel
      tags: [custom-models]
      summary: Update mutable fields on a custom model
      description: |
        Update the model record (cp-side) and propagate the change to the
        live deployment when applicable. Only a small set of fields are
        mutable post-create; immutable fields (`huggingface_model_id`,
        `weight_source`, GPU topology, …) are intentionally not exposed
        here — change them by deleting and re-creating the model.

        Today the only fields that take effect immediately on the live
        deployment are `min_replicas` and `max_replicas`: cp updates the
        DynamoDB record, then issues an AF-side in-place patch of the
        underlying InferenceService's predictor scale bounds (no rolling
        restart, no downtime). KServe propagates `max_replicas` through
        to the KEDA `ScaledObject`'s `maxReplicaCount` on its next
        reconcile.

        Other fields update the model record only and take effect on the
        next deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelUpdate'
            examples:
              pinReplicas:
                summary: Pin one replica online (disable scale-to-zero)
                value:
                  min_replicas: 1
                  max_replicas: 1
              widenScalingCeiling:
                summary: Raise the autoscaling ceiling
                value:
                  max_replicas: 3
      responses:
        '200':
          description: Updated model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/custom-models/{modelId}/refresh:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: refreshCustomModel
      tags: [custom-models]
      summary: Refresh a custom model's status
      description: |
        Forces a re-fetch of live deployment status from the underlying
        cluster. Useful when a model has been scaled to zero or recently
        updated. The returned record may include refreshed `endpoint`,
        `status`, and `error_message` fields.
      responses:
        '200':
          description: Refreshed model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/custom-models/{modelId}/wake:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: wakeCustomModel
      tags: [custom-models]
      summary: Wake a scaled-to-zero custom model
      description: |
        Custom models scale to zero replicas after `cooldown_seconds` of
        inactivity. Calling `wake` brings the deployment back up to its
        configured `min_replicas` (or 1 if `min_replicas` is 0). Returns
        immediately; poll `getCustomModel` until `status: "ready"` and a
        non-empty `endpoint`.
      responses:
        '200':
          description: Wake initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Model has no active deployment to wake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/{workspaceId}/custom-models/{modelId}/gpu-hours:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getCustomModelGpuHours
      tags: [custom-models]
      summary: Get cumulative GPU-hours billed for a custom model
      responses:
        '200':
          description: GPU-hours total since model creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuHoursResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/custom-models/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: checkCustomModelAccess
      tags: [custom-models]
      summary: Check whether the workspace is allowlisted for custom models
      description: |
        Custom model imports are gated by an internal allowlist while the
        feature is in beta. Use this endpoint before showing import UI.
      responses:
        '200':
          description: Allowlist check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: validateCustomModel
      tags: [custom-models]
      summary: Validate a HuggingFace model before import
      description: |
        Inspects the HuggingFace `config.json` to verify the model
        architecture is supported, estimates GPU memory requirements,
        and reports whether the model supports speculative decoding.
        Always returns 200 — failures are reflected by `valid: false`
        and a populated `error` field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateModelRequest'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateModelResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/supported-architectures:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getSupportedArchitectures
      tags: [custom-models]
      summary: List model architectures supported for custom-model import
      description: |
        Returns the static list of HuggingFace model architectures the
        platform's serving runtimes can deploy, alongside the capability
        tags (`tool_calling`, `vision`, etc.) each architecture exposes.
        Use this to drive the UI's architecture/capability filters before
        calling `validateCustomModel`.

        The list is updated alongside platform runtime upgrades; clients
        should not cache it for more than a build cycle.
      responses:
        '200':
          description: Architecture catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedArchitectures'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/secrets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createSecret
      tags: [secrets]
      summary: Create a workspace secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
            examples:
              huggingfaceToken:
                summary: HuggingFace access token
                value:
                  name: hf-token
                  value: hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '201':
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List workspace secrets
      description: |
        Returns secret metadata only — `value_preview` is the first few
        characters of the value, suitable for UI display. The full
        plaintext value is never returned.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
      responses:
        '200':
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SecretId'
    put:
      operationId: updateSecret
      tags: [secrets]
      summary: Update a secret's value
      description: |
        Rotates the secret's plaintext value. The secret's `name` and
        other metadata are immutable; create a new secret if you need
        a different name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a secret
      responses:
        '204':
          description: Secret deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: OpenAI-compatible chat completion
      description: |
        Accepts the standard OpenAI chat completion request body. When
        `stream: true`, the response is a `text/event-stream` of OpenAI
        SSE chunks. Use a custom model's `name` (or a built-in model's
        alias) as the `model` field.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              builtIn:
                summary: Built-in model
                value:
                  model: qwen3-80b
                  messages:
                    - { role: user, content: "Write a haiku about GPUs." }
              customModel:
                summary: Custom model with streaming
                value:
                  model: my-llama
                  stream: true
                  messages:
                    - { role: user, content: "Hi" }
      responses:
        '200':
          description: |
            OpenAI-compatible response. When `stream: true`, the body is
            a `text/event-stream` of OpenAI chunks; otherwise a JSON
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: "Newline-delimited OpenAI SSE chunks ending in `data: [DONE]`."
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InferenceNotFound'
        '503':
          $ref: '#/components/responses/InferenceUnavailable'

  /v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List models available to the workspace
      description: |
        Returns built-in models, imported models, and custom models in
        OpenAI `/v1/models` format. Use the returned `id` as the `model`
        field on `createChatCompletion`.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Model list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tts:
    post:
      operationId: synthesizeSpeech
      tags: [tts]
      summary: Synthesize speech from text
      description: |
        Returns audio bytes in the format implied by `responseFormat`
        (Qwen models) or fixed by the upstream provider (Rime returns
        MP3). Streaming is provider-defined.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: Synthesized audio.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
            audio/opus:
              schema: { type: string, format: binary }
            audio/flac:
              schema: { type: string, format: binary }
            audio/pcm:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InferenceNotFound'

  /v1/tts/voices:
    get:
      operationId: listTtsVoices
      tags: [tts]
      summary: List TTS voices for a model
      servers:
        - url: https://model.graphn.ai
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string }
          description: Model alias to list voices for.
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: |
            Voice catalog. Schema is provider-specific; treat the
            response as opaque JSON keyed by `voices[].id`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/imported-models/discover-models:
    post:
      operationId: discoverImportedModels
      tags: [imported-models]
      summary: List models available at an external OpenAI-compatible endpoint
      description: |
        Calls `{endpoint}/models` using the API key resolved from the
        referenced workspace secret. Filters out non-chat models
        (embeddings, TTS, image, moderation, etc.).
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverImportedModelsRequest'
      responses:
        '200':
          description: Discovered chat models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverImportedModelsResponse'
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Upstream endpoint returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'

  /v1/imported-models/test-connection:
    post:
      operationId: testImportedModelConnection
      tags: [imported-models]
      summary: Test connectivity to an external chat model
      description: |
        Sends a single chat completion to the configured endpoint and
        returns the response text. Use to verify credentials and
        endpoint URL before importing.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionRequest'
      responses:
        '200':
          description: Test completion succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResponse'
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Upstream endpoint returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'

  /v1/{orgId}/billing/account:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBillingAccount
      tags: [billing]
      summary: Get organization billing account
      responses:
        '200':
          description: Billing account settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingAccount'}
        '404': {$ref: '#/components/responses/NotFound'}
