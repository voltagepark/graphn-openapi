openapi: 3.1.0
info:
  title: Graphn API
  version: 0.28.0
  description: |
    Public API for the Graphn AI platform.

    The Graphn API is the customer-facing surface for the agent platform:
    workflows, agents, functions, MCP servers, knowledge bases, executions,
    triggers, storage, organizations, and OpenAI-compatible inference
    (chat completions, model listings, and TTS).

    ## Hosts

    The API is split across four hosts. Operations are tagged and use
    per-operation `servers` overrides so generated SDKs that respect
    OpenAPI 3.1 per-operation `servers` (openapi-python-client >= 0.20,
    openapi-generator >= 6.0, oapi-codegen >= 1.16, @hey-api/openapi-ts)
    route correctly out of the box.

    - **Control plane** (`https://cp.graphn.ai`) — workspace-scoped CRUD
      for agents, functions, MCP servers, workflows, knowledge bases,
      secrets, custom models, storage buckets, organizations, and billing.
    - **Inference** (`https://model.graphn.ai`) — OpenAI-compatible
      chat completions, model listings, and TTS.
    - **Gateway** (`https://gateway.graphn.ai`) — async workflow runs,
      batch jobs, and UUID-keyed execution polling / cancel.
    - **Storage** (`https://storage.graphn.ai`) — S3-style object API
      used by the CLI (`graphn storage`). The control plane also exposes
      a REST overlay at `/v1/{workspaceId}/storages`.

    ## Authentication

    All endpoints require a workspace-scoped API key passed as
    `Authorization: Bearer gn_...`. Create keys in the Graphn dashboard
    or via `createApiKey`. Send `X-Workspace-Id` when the key is not
    already workspace-scoped.

    ## Errors

    Control-plane errors return a JSON envelope:

    ```json
    { "code": "NOT_FOUND", "message": "model not found" }
    ```

    The `code` field is a machine-readable identifier; `message` is
    intended for end-user display. Inference errors use the OpenAI-style
    `InferenceError` envelope.
  contact:
    name: Graphn OpenAPI Issues
    url: https://github.com/voltagepark/graphn-openapi/issues
  license:
    name: Proprietary
servers:
  - url: https://cp.graphn.ai
    description: Control plane (default)
    x-graphn-name: control-plane
  - url: https://model.graphn.ai
    description: Inference
    x-graphn-name: inference
  - url: https://gateway.graphn.ai
    description: Gateway (async, batch, UUID executions)
    x-graphn-name: gateway
  - url: https://storage.graphn.ai
    description: Object storage (S3-style)
    x-graphn-name: storage
security:
  - ApiKeyAuth: []
tags:
  - name: custom-models
    description: |
      Manage custom model imports — register a HuggingFace or S3-hosted
      model, monitor its deployment, and tear it down. Inference against
      a `ready` custom model uses the `chat.completions` endpoint with
      the model's `name`.
  - name: secrets
    description: |
      Workspace-scoped opaque secrets (e.g. HuggingFace tokens, third-party
      API keys) referenced by other resources via their `id`.
  - name: connections
    description: |
      Workspace-owned authorization grants for native integrations and
      authenticated remote MCP servers. Credentials never appear in responses.
  - name: chat
    description: OpenAI-compatible chat completions.
  - name: models
    description: List available models for a workspace.
  - name: tts
    description: Text-to-speech synthesis and voice catalog.
  - name: imported-models
    description: |
      Import an external OpenAI-compatible endpoint into a workspace,
      plus probe helpers (`discover-models`, `test-connection`) on the
      inference host.
  - name: inference-routers
    description: Workspace-scoped multi-model routing configuration.
  - name: billing
    description: Organization billing account, top-up, and usage operations.
  - name: admin-billing
    description: Administrative billing overrides and credit grants.
  - name: agents
    description: Workspace-scoped agent CRUD, publish, and run.
  - name: functions
    description: Workspace-scoped Python functions (FES sandboxes) and builtins.
  - name: mcp-servers
    description: Hosted and remote MCP servers, tools, and runtime control.
  - name: workflows
    description: Workflow CRUD, bundle, publish, versions, run, and test.
  - name: executions
    description: |
      Poll workflow executions. `exec_` / `test_` ids live on the control
      plane; UUID operation ids live on the gateway.
  - name: triggers
    description: Cron and webhook triggers that invoke a published workflow.
  - name: knowledgebases
    description: Vector knowledge bases, documents, search, and async ingest.
  - name: organizations
    description: Organizations the caller belongs to.
  - name: workspaces
    description: Workspaces inside an organization.
  - name: members
    description: Organization and workspace membership.
  - name: invitations
    description: Invite users to an organization or workspace.
  - name: api-keys
    description: Workspace-scoped API keys (`gn_...`).
  - name: blueprints
    description: Public workflow blueprint catalog and one-shot deploy.
  - name: connectors
    description: Connector catalog used when wiring third-party secrets.
  - name: embed
    description: Standalone text embeddings (same models as knowledge bases).
  - name: storages
    description: REST overlay for workspace object stores (UI / SDK).
  - name: objects
    description: S3-style object API on the storage host (CLI `graphn storage`).
  - name: batch
    description: Gateway batch jobs over a published workflow.
  - name: async
    description: Gateway async workflow runs (UUID operation ids).

paths:
  /v1/{workspaceId}/custom-models:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createCustomModel
      tags: [custom-models]
      summary: Register a new custom model
      description: |
        Begin import + deployment of a custom model. The response returns
        immediately with `status: "deploying"`. Poll `getCustomModel`
        (or use the SDK's `wait_until_ready`) until the status reaches
        `ready` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelCreate'
            examples:
              huggingface:
                summary: HuggingFace import
                value:
                  name: my-llama
                  huggingface_model_id: meta-llama/Llama-3-8B-Instruct
                  hf_token_secret_id: sec_01HABCXYZ
                  gpu_count: 1
                  max_replicas: 1
              s3PresignedUrl:
                summary: S3 presigned URL import
                value:
                  name: internal-model
                  weight_source: s3_presigned
                  huggingface_model_id: Qwen/Qwen3-0.6B
                  s3_url: https://my-bucket.s3.amazonaws.com/model.tar.gz?X-Amz-...
      responses:
        '201':
          description: Model accepted; deployment started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listCustomModels
      tags: [custom-models]
      summary: List custom models in a workspace
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
        - name: include
          in: query
          required: false
          description: |
            Preview. `adapters` also lists the adapters attached to shared
            LoRA bases; without it adapters are omitted.
          schema:
            type: string
            enum: [adapters]
      responses:
        '200':
          description: A page of custom models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getCustomModel
      tags: [custom-models]
      summary: Get a custom model
      description: |
        Returns the latest known state of the custom model, enriched with
        live deployment status (replica counts, endpoint readiness). An
        adapter reports its base's GPU and replica fields.
      responses:
        '200':
          description: Custom model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomModel
      tags: [custom-models]
      summary: Delete a custom model
      description: |
        Tears down the deployment and removes the model record. Idempotent.
        A shared LoRA base with adapters attached is refused with
        `409 HAS_ADAPTERS`.

        Deleting an adapter starts its removal from the base: it reads
        `deleting` until the base has unloaded it, and repeating the call
        returns `204`. An adapter an inference router lists is refused with
        `409 CUSTOM_MODEL_IN_USE`.
      responses:
        '204':
          description: Model deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updateCustomModel
      tags: [custom-models]
      summary: Update mutable fields on a custom model
      description: |
        Update the model record (cp-side) and propagate the change to the
        live deployment when applicable. Only a small set of fields are
        mutable post-create; immutable fields (`huggingface_model_id`,
        `weight_source`, GPU topology, …) are intentionally not exposed
        here — change them by deleting and re-creating the model.

        Today the only fields that take effect immediately on the live
        deployment are `min_replicas` and `max_replicas`. They are
        applied to the running deployment's scale bounds in place, with
        no restart and no downtime.

        Other fields update the model record only and take effect on the
        next deployment.

        On an adapter only `name` is accepted; its replicas are its base's.
        An adapter being deleted is refused with `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelUpdate'
            examples:
              pinReplicas:
                summary: Pin one replica online (disable scale-to-zero)
                value:
                  min_replicas: 1
                  max_replicas: 1
              widenScalingCeiling:
                summary: Raise the autoscaling ceiling
                value:
                  max_replicas: 8
      responses:
        '200':
          description: Updated model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/{workspaceId}/custom-models/{modelId}/adapters:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: attachCustomModelAdapter
      tags: [custom-models]
      summary: Attach a LoRA adapter to a shared base
      description: |
        Preview, refused with `409 SHARED_LORA_UNSUPPORTED` unless enabled
        for the workspace's deployment. Registers a LoRA adapter on a
        shared LoRA base (a custom model created with `lora_enabled`). The
        adapter uses no GPU of its own: the base loads it, and clients
        call it as `custom:<id>` in chat completions once it is `ready`,
        where `id` is the adapter's own ID from the response. The response
        returns immediately with the adapter `pending`.

        Refusals: `409 NOT_LORA_ENABLED` when the model is not a shared
        LoRA base, `409 BASE_NOT_AVAILABLE` when the base has failed or is
        being deleted, `422 ADAPTER_LIMIT_EXCEEDED` when the base already
        has `max_adapters` attached, and `409 ALREADY_EXISTS` when the name
        is taken in the workspace. Attaching is gated like importing a
        model: `402 PURCHASE_REQUIRED` and `403 CUSTOM_MODELS_DISABLED`.

        Staging validates the adapter's files after the attach. An adapter
        that fails then, or later fails to roll out, reads `failed` with an
        `error_message` that starts with a reason code: `ADAPTER_INVALID`,
        `ADAPTER_RANK_EXCEEDS_BASE`, `ADAPTER_BASE_MISMATCH`,
        `ADAPTER_LOAD_FAILED`, `WAITING_FOR_GPU_TIMEOUT` or
        `INFRASTRUCTURE_UNAVAILABLE`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Makes the attach safe to retry for 24 hours. Repeating a request
            with the same key and body returns the original `201`; the same
            key with a different body is refused with
            `409 IDEMPOTENCY_KEY_REUSED`.
          schema:
            type: string
            pattern: '^[\x21-\x7E]{1,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomModelAdapterAttach'
            examples:
              huggingface:
                summary: HuggingFace adapter
                value:
                  name: support-tone
                  huggingface_model_id: my-org/qwen3-32b-support-lora
      responses:
        '201':
          description: Adapter registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The organization has not made a purchase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The base already has `max_adapters` attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCustomModelAdapters
      tags: [custom-models]
      summary: List the adapters attached to a shared base
      description: |
        Preview. Every adapter on the base, oldest first, including those
        that failed or are being deleted. Each reports the base's GPU and
        replica fields.
      responses:
        '200':
          description: The base's adapters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/{workspaceId}/custom-models/{modelId}/refresh:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: refreshCustomModel
      tags: [custom-models]
      summary: Refresh a custom model's status
      description: |
        Forces a re-fetch of live deployment status from the underlying
        cluster. Useful when a model has been scaled to zero or recently
        updated. The returned record may include refreshed `endpoint`,
        `status`, and `error_message` fields.

        An adapter has no deployment of its own: refreshing one is refused
        with `422 ADAPTER_REFRESH_UNSUPPORTED`; refresh its base instead.
      responses:
        '200':
          description: Refreshed model record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The model is an adapter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/{workspaceId}/custom-models/{modelId}/wake:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: wakeCustomModel
      tags: [custom-models]
      summary: Wake a scaled-to-zero custom model
      description: |
        Custom models scale to zero replicas after `cooldown_seconds` of
        inactivity. Calling `wake` brings the deployment back up to its
        configured `min_replicas` (or 1 if `min_replicas` is 0). Returns
        immediately; poll `getCustomModel` until `status: "ready"` and a
        non-empty `endpoint`.

        Preview: waking an adapter wakes its shared base; the response is
        the adapter, with its base's replica fields. Only a `ready` adapter wakes its base; any
        other, or one whose base is failed, deleting or has serving turned
        off, is refused with `409 NOT_SERVING`. `403 OWNER_NOT_ACTIVE` means
        the base's owner is suspended or being deleted.
      responses:
        '200':
          description: Wake initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Model has no active deployment to wake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/{workspaceId}/custom-models/{modelId}/gpu-hours:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getCustomModelGpuHours
      tags: [custom-models]
      summary: Get cumulative GPU-hours billed for a custom model
      responses:
        '200':
          description: GPU-hours total since model creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuHoursResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/custom-models/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: checkCustomModelAccess
      tags: [custom-models]
      summary: Check whether the workspace is allowlisted for custom models
      description: |
        Custom model imports are gated by an internal allowlist while the
        feature is in beta. Use this endpoint before showing import UI.
      responses:
        '200':
          description: Allowlist check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: validateCustomModel
      tags: [custom-models]
      summary: Validate a HuggingFace model before import
      description: |
        Inspects the HuggingFace `config.json` to verify the model
        architecture is supported, estimates GPU memory requirements,
        and reports whether the model supports speculative decoding.
        Always returns 200 — failures are reflected by `valid: false`
        and a populated `error` field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateModelRequest'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateModelResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/custom-models/supported-architectures:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getSupportedArchitectures
      tags: [custom-models]
      summary: List model architectures supported for custom-model import
      description: |
        Returns the static list of HuggingFace model architectures the
        platform's serving runtimes can deploy, alongside the capability
        tags (`tool_calling`, `vision`, etc.) each architecture exposes.
        Use this to drive the UI's architecture/capability filters before
        calling `validateCustomModel`.

        The list is updated alongside platform runtime upgrades; clients
        should not cache it for more than a build cycle.
      responses:
        '200':
          description: Architecture catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedArchitectures'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/inference-routers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createInferenceRouter
      tags: [inference-routers]
      summary: Create an inference router draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRouterCreate'
      responses:
        '201':
          description: Router draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listInferenceRouters
      tags: [inference-routers]
      summary: List workspace and platform inference routers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
      responses:
        '200':
          description: Router page. The immutable platform `auto` router is prepended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/inference-routers/{routerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: routerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getInferenceRouter
      tags: [inference-routers]
      summary: Get an inference router
      responses:
        '200':
          description: Router record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouter'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateInferenceRouter
      tags: [inference-routers]
      summary: Create a new immutable draft revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRouterUpdate'
      responses:
        '200':
          description: Updated router with a new draft revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteInferenceRouter
      tags: [inference-routers]
      summary: Delete a workspace inference router
      responses:
        '204':
          description: Router deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/inference-routers/{routerId}/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: routerId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: validateInferenceRouter
      tags: [inference-routers]
      summary: Validate the current draft and derive its target manifest
      responses:
        '200':
          description: Validated manifest and hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterValidation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/inference-routers/{routerId}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: routerId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishInferenceRouter
      tags: [inference-routers]
      summary: Submit a draft revision for controller activation
      description: The existing active revision remains routable until acknowledgement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_draft_revision]
              properties:
                expected_draft_revision:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Revision is pending controller activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/{workspaceId}/inference-routers/{routerId}/analytics:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: routerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getInferenceRouterAnalytics
      tags: [inference-routers]
      summary: Get router usage analytics
      description: Available only when inference-router analytics is enabled for the deployment.
      parameters:
        - name: start_time
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end_time
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: day
      responses:
        '200':
          description: Router totals, time series, and bounded breakdowns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterAnalytics'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/inference-router-lanes:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createInferenceRouterLane
      tags: [inference-routers]
      summary: Create a workspace custom router lane
      description: >-
        A custom lane is a list of literal phrases, matched case-insensitively
        on word boundaries. Candidates in this workspace's routers reference it
        as `custom:<id>`. Lanes are visible only inside their own workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRouterLaneCreate'
      responses:
        '201':
          description: Lane created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterLane'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listInferenceRouterLanes
      tags: [inference-routers]
      summary: List workspace custom router lanes
      responses:
        '200':
          description: Every lane in the workspace, with the routers using each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterLaneList'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/inference-router-lanes/{laneId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: laneId
        in: path
        required: true
        schema:
          type: string
          pattern: '^lane_[0-9a-f]{12}$'
    get:
      operationId: getInferenceRouterLane
      tags: [inference-routers]
      summary: Get a workspace custom router lane
      responses:
        '200':
          description: Lane record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterLane'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateInferenceRouterLane
      tags: [inference-routers]
      summary: Update a workspace custom router lane
      description: >-
        Published router revisions keep the lane definition they were saved
        with; republish a router to apply the change to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRouterLaneUpdate'
      responses:
        '200':
          description: Updated lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRouterLane'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteInferenceRouterLane
      tags: [inference-routers]
      summary: Delete a workspace custom router lane
      description: >-
        Refused with 409 while any router's draft, pending, active, or
        still-draining previous revision references the lane (see
        `used_by`), including a router save that commits during the delete.
      responses:
        '204':
          description: Lane deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/{workspaceId}/secrets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createSecret
      tags: [secrets]
      summary: Create a workspace secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
            examples:
              huggingfaceToken:
                summary: HuggingFace access token
                value:
                  name: hf-token
                  value: hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '201':
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List workspace secrets
      description: |
        Returns secret metadata only — `value_preview` is the first few
        characters of the value, suitable for UI display. The full
        plaintext value is never returned.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
      responses:
        '200':
          description: A page of secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SecretId'
    put:
      operationId: updateSecret
      tags: [secrets]
      summary: Update a secret's value
      description: |
        Rotates the secret's plaintext value. The secret's `name` and
        other metadata are immutable; create a new secret if you need
        a different name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a secret
      responses:
        '204':
          description: Secret deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/connections:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a pending workspace connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: Pending connection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listConnections
      tags: [connections]
      summary: List workspace connections
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ContinueToken'
      responses:
        '200':
          description: A page of connections without credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/{workspaceId}/connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    get:
      operationId: getConnection
      tags: [connections]
      summary: Get connection metadata
      responses:
        '200':
          description: Connection metadata without credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: disconnectConnection
      tags: [connections]
      summary: Revoke and disconnect a connection
      description: |
        Clears the stored credential while retaining the opaque connection ID
        so dependent resources can be reconnected without rebinding.
      responses:
        '204':
          description: Connection disconnected.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{workspaceId}/connections/{connectionId}/authorize:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
    post:
      operationId: authorizeConnection
      tags: [connections]
      summary: Start or restart provider authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionAuthorizationStart'
      responses:
        '200':
          description: Browser authorization URL and transaction expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuthorizationChallenge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/integrations:
    get:
      operationId: listIntegrations
      tags: [connections]
      summary: List GraphN-managed integration definitions
      responses:
        '200':
          description: Available integrations and their capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/oauth/connections/{providerId}/callback:
    get:
      operationId: completeConnectionAuthorization
      tags: [connections]
      summary: Complete a provider OAuth authorization
      description: |
        Public OAuth callback. Tenant identity, PKCE data, and the final redirect
        are recovered exclusively from one-time encrypted state.
      security: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '303':
          description: Redirect to the trusted GraphN web origin.
        '400':
          $ref: '#/components/responses/ValidationError'

  /v1/connections/events/gmail:
    post:
      operationId: receiveGmailPubSubEvent
      tags: [connections]
      summary: Receive a Google Pub/Sub push for Gmail watches
      description: |
        Provider callback authenticated with the configured Google Pub/Sub
        push-service-account OIDC token and exact audience.
      security:
        - GoogleOIDC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePubSubEnvelope'
      responses:
        '204':
          description: Notification accepted and processed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Notification processing failed and should be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/internal/workspaces/{workspaceId}/connections/{connectionId}/tools/{toolName}/call:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionId'
      - name: toolName
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 512 }
    post:
      operationId: callManagedConnectionTool
      tags: [connections]
      summary: Invoke a GraphN-managed MCP tool
      description: Internal service-to-service endpoint.
      security:
        - InternalJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedConnectionToolCall'
      responses:
        '200':
          description: Managed tool result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedConnectionToolResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: OpenAI-compatible chat completion
      description: |
        Accepts the standard OpenAI chat completion request body. When
        `stream: true`, the response is a `text/event-stream` of OpenAI
        SSE chunks. Use a custom model's `name` (or a built-in model's
        alias) as the `model` field.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              builtIn:
                summary: Built-in model
                value:
                  model: qwen3-80b
                  messages:
                    - { role: user, content: "Write a haiku about GPUs." }
              customModel:
                summary: Custom model with streaming
                value:
                  model: my-llama
                  stream: true
                  messages:
                    - { role: user, content: "Hi" }
      responses:
        '200':
          description: |
            OpenAI-compatible response. When `stream: true`, the body is
            a `text/event-stream` of OpenAI chunks; otherwise a JSON
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: "Newline-delimited OpenAI SSE chunks ending in `data: [DONE]`."
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InferenceNotFound'
        '503':
          $ref: '#/components/responses/InferenceUnavailable'

  /v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List models available to the workspace
      description: |
        Returns built-in models, imported models, and custom models in
        OpenAI `/v1/models` format. Use the returned `id` as the `model`
        field on `createChatCompletion`.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Model list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tts:
    post:
      operationId: synthesizeSpeech
      tags: [tts]
      summary: Synthesize speech from text
      description: |
        Returns audio bytes in the format implied by `responseFormat`
        (Qwen models) or fixed by the upstream provider (Rime returns
        MP3). Streaming is provider-defined.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: Synthesized audio.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
            audio/opus:
              schema: { type: string, format: binary }
            audio/flac:
              schema: { type: string, format: binary }
            audio/pcm:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InferenceNotFound'

  /v1/tts/voices:
    get:
      operationId: listTtsVoices
      tags: [tts]
      summary: List TTS voices for a model
      servers:
        - url: https://model.graphn.ai
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string }
          description: Model alias to list voices for.
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: |
            Voice catalog. Schema is provider-specific; treat the
            response as opaque JSON keyed by `voices[].id`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/imported-models/discover-models:
    post:
      operationId: discoverImportedModels
      tags: [imported-models]
      summary: List models available at an external OpenAI-compatible endpoint
      description: |
        Calls `{endpoint}/models` using the API key resolved from the
        referenced workspace secret. Filters out non-chat models
        (embeddings, TTS, image, moderation, etc.).
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverImportedModelsRequest'
      responses:
        '200':
          description: Discovered chat models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverImportedModelsResponse'
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Upstream endpoint returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'

  /v1/imported-models/test-connection:
    post:
      operationId: testImportedModelConnection
      tags: [imported-models]
      summary: Test connectivity to an external chat model
      description: |
        Sends a single chat completion to the configured endpoint and
        returns the response text. Use to verify credentials and
        endpoint URL before importing.
      servers:
        - url: https://model.graphn.ai
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionRequest'
      responses:
        '200':
          description: Test completion succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResponse'
        '400':
          $ref: '#/components/responses/InferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Upstream endpoint returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'

  /v1/{orgId}/billing/account:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBillingAccount
      tags: [billing]
      summary: Get organization billing account
      responses:
        '200':
          description: Billing account settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingAccount'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/{orgId}/billing/account/settings:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: updateBillingAccountSettings
      tags: [billing]
      summary: Update organization billing settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingSettingsUpdate'}
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/{orgId}/billing/topups:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: createBillingTopUp
      tags: [billing]
      summary: Charge the saved payment method and add credits
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingTopUpRequest'}
      responses:
        '200':
          description: Top-up completed or replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingGrantResult'}
        '402': {description: Payment failed.}
        '428': {description: No payment method is available.}
  /v1/{orgId}/billing/setup-intent:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: createBillingSetupIntent
      tags: [billing]
      summary: Create a payment-method setup intent
      responses:
        '200':
          description: Stripe SetupIntent client secret.
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret]
                properties:
                  clientSecret: {type: string}
  /v1/{orgId}/billing/payment-methods:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listBillingPaymentMethods
      tags: [billing]
      summary: List saved payment methods
      responses:
        '200':
          description: Saved payment methods.
          content:
            application/json:
              schema:
                type: object
                required: [paymentMethods]
                properties:
                  paymentMethods:
                    type: array
                    items: {$ref: '#/components/schemas/PaymentMethod'}
  /v1/{orgId}/billing/payment-methods/{paymentMethodId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
      - name: paymentMethodId
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: detachBillingPaymentMethod
      tags: [billing]
      summary: Detach a saved payment method
      responses:
        '204': {description: Payment method detached.}
        '409': {description: The last payment method cannot be detached.}
  /v1/{orgId}/billing/payment-methods/{paymentMethodId}/default:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
      - name: paymentMethodId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: setDefaultBillingPaymentMethod
      tags: [billing]
      summary: Set the default payment method
      responses:
        '204': {description: Default payment method updated.}
  /v1/{orgId}/billing/invoices:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 100}
    get:
      operationId: listBillingInvoices
      tags: [billing]
      summary: List billing invoices
      responses:
        '200':
          description: Billing invoices.
          content:
            application/json:
              schema:
                type: object
                required: [invoices]
                properties:
                  invoices:
                    type: array
                    items: {$ref: '#/components/schemas/Invoice'}
  /v1/{orgId}/billing/invoices/{invoiceId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: string}
      - name: invoiceId
        in: path
        required: true
        schema: {type: string}
    get:
